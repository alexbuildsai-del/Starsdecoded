        - updatedAt

    ProfileSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        birthDate: { type: string }
        birthTime: { type: string }
        birthPlace: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        timezoneOffset: { type: number }
        timezone: { type: string, nullable: true }
        birthTimeWindowMinutes: { type: integer }
        horizon:
          type: string
          enum: [known, approximate, unknown]
          nullable: true
        sunSign: { type: string, nullable: true }
        moonSign: { type: string, nullable: true }
        risingSign: { type: string, nullable: true }
        createdAt: { type: string }
        ownership:
          type: string
          enum: [owner, claimed, invited, unclaimed]
          description: Viewer-relative ownership status of the profile.
        claimedByName: { type: string, nullable: true }
        inviteEmail: { type: string, nullable: true }
        isSelf:
          type: boolean
          description: >
            True if this is the viewer's own chart from the viewer's side: the
            owner's is_self, set by the "Generate My Chart" flow (isForSelf=true
            in POST /reports), or the claimer's claimed_as_self (ADR-120).
            Never derived by heuristic. Always false for anonymous viewers.
        claimedAsSelf:
          type: boolean
          description: The claimer marked this sent chart as their own, This is me; false after Not me and on the owner's charts (ADR-120).
        giverName:
          type: string
          nullable: true
          description: First name of whoever sent this chart to the viewer; null on the viewer's own (ADR-139).
        send:
          description: Send to {name} for this person; null where it is not offered (ADR-120, ADR-139).
          anyOf:
            - $ref: "#/components/schemas/SendState"
            - type: "null"
      required: [id, name, birthDate, birthTime, birthPlace, createdAt]

    CreateProfileBody:
      type: object
      properties:
        name:
          type: string
          # MB-157 provisional: ・, the ideographic space and ZWNJ, so Japanese and Persian names go in as written.
          pattern: '^(?=.*\p{L})(?![ \u3000])(?!.*[ \u3000]$)[\p{L}\p{M} \u3000''’.·・\u200C-]{1,60}$'
          description: >-
            The person's name, 1 to 60 characters: letters, marks, spaces (the
            ideographic space too), apostrophes (' ’), hyphens, dots (. · ・)
            and the zero-width non-joiner some scripts spell names with; at
            least one letter, and no space at either end. So what reaches the
            prompt is a name and never markup or an instruction (ADR-202).
        birthDate: { type: string }
        birthTime: { type: string }
        birthPlace: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        timezoneOffset: { type: number }
        timezone: { type: string, description: "IANA zone name; preferred over timezoneOffset (MB-48)." }
        birthTimeWindowMinutes: { type: integer, description: "0 exact, 180 a part of the day, 720 unknown (ADR-33). Default 0." }
      required: [name, birthDate, birthTime, birthPlace, latitude, longitude, timezoneOffset]

    UpdateProfileBody:
      type: object
      description: Mutable profile fields, isSelf for the owner and claimedAsSelf for the claimer.
      properties:
        isSelf:
          type: boolean
          description: >
            Set to true to designate this profile as the viewer's own self-profile.
            Setting true automatically clears isSelf on all other profiles owned by
            the same user (one per user). Set to false to unmark it.
        claimedAsSelf:
          type: boolean
          description: The claimer's This is me (true) or Not me (false) on a sent chart (ADR-120).

