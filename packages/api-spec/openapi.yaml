        shareBack:
          type: boolean
          description: On a share's claim, Share yours back is offered, since the claimer has a finished Personal report of their own not yet shared with the sharer (ADR-235, MB-104).
      required: [profileId, redirectTo]

    Gift:
      type: object
      description: A gift as its giver sees it, a held credit and a state, never anything the recipient makes (ADR-123, ADR-139).
      properties:
        id: { type: string }
        recipientName: { type: string }
        email: { type: string }
        note: { type: string, nullable: true }
        sentAt: { type: string, description: "ISO-8601 timestamp when the gift went out" }
        returnsAt:
          type: string
          description: When the held credit returns if the gift is still unclaimed, 30 days after sentAt (ADR-123).
        remindedAt: { type: string, nullable: true, description: "The last reminder; null before any" }
        state:
          type: string
          enum: [waiting, claimed, returned]
          description: Waiting until claimed; returned once taken back or unclaimed at returnsAt (ADR-123).
        creditHeld:
          type: boolean
          description: True while one of the giver's credits is held for it (ADR-123); false once claimed or returned, or on a gift sent under the old soft pass, which held none (closed by ADR-275).
      required: [id, recipientName, email, note, sentAt, returnsAt, remindedAt, state, creditHeld]

    GiftCreated:
      description: >-
        What POST /gifts answers: the gift, plus the claim link exactly as
        its email carried it and whether that email reached the recipient,
        the same two fields POST /invites answers (ADR-123). The raw token
        lives only in this one response; GET /gifts stores just its hash
        and can never rebuild the link.
      allOf:
        - $ref: "#/components/schemas/Gift"
        - type: object
          properties:
            claimUrl:
              type: string
              description: The link to copy and send by hand when the email did not go.
            emailDelivered:
              type: boolean
          required: [claimUrl, emailDelivered]

    CreateGiftBody:
      type: object
      description: Gift a report to someone by name and email, with a note for the cover (ADR-128, ADR-139).
      properties:
        recipientName:
          type: string
          # MB-157 provisional: ・, the ideographic space and ZWNJ, so Japanese and Persian names go in as written.
          pattern: '^(?=.*\p{L})(?![ \u3000])(?!.*[ \u3000]$)[\p{L}\p{M} \u3000''’.·・\u200C-]{1,60}$'
          description: >-
            The recipient's name, 1 to 60 characters: letters, marks, spaces
            (the ideographic space too), apostrophes (' ’), hyphens, dots
            (. · ・) and the zero-width non-joiner; at least one letter, and no
            space at either end. The same rule as every typed name (ADR-202).
        email: { type: string, format: email }
        note: { type: string, maxLength: 280 }
      required: [recipientName, email]

    ChangeAddressBody:
      type: object
      description: Change address on a waiting send or gift, the corrected address its new link goes to (ADR-237, MB-109).
      properties:
        email: { type: string, format: email }
      required: [email]

    CreateShareBody:
      type: object
      description: Share my report, the address of whoever should read the viewer's own Personal report (ADR-235, MB-104).
      properties:
        email: { type: string, format: email }
      required: [email]

    ShareCreated:
      type: object
      description: >-
        What POST /shares answers: the share, waiting, plus the claim link
        exactly as its email carried it and whether that email went, as
        POST /invites answers (ADR-235).
      properties:
        id: { type: string }
        email: { type: string }
        claimUrl:
          type: string
          description: The link to copy and send by hand when the email did not go.
        expiresAt: { type: string }
        emailDelivered: { type: boolean }
      required: [id, email, claimUrl, expiresAt, emailDelivered]

    Share:
      type: object
      description: One person the viewer's own Personal report is shared with, as the sharer's quick look lists them (ADR-235).
      properties:
        id: { type: string }
        email:
          type: string
          description: The address the link went to; empty for a share made by Share yours back, which goes to no address, so the sharer is never given the reader's (R-3.6).
        readerName:
          type: string
          nullable: true
          description: The reader's first name once they claim it; null while the link waits (ADR-235).
        state:
          type: string
          enum: [waiting, active]
          description: waiting until the link is claimed; active while the grant reads (ADR-235).
        sentAt: { type: string, description: "ISO-8601 timestamp when the share went out" }
      required: [id, email, readerName, state, sentAt]

    ShareBackBody:
      type: object
      description: Share yours back, naming the sharer by the Personal report of theirs the viewer reads (ADR-235, MB-104).
      properties:
        profileId:
          type: string
          description: The sharer's profile shared with the viewer, which names who gets the viewer's own report back.
      required: [profileId]

    HandBackResponse:
      type: object
      description: What Hand it back answers, the profile now back with its writer alone (ADR-236, MB-103).
      properties:
        profileId: { type: string }
      required: [profileId]

    GeocodeResult:
      type: object
      properties:
        name:
          type: string
          description: Full display name (City, Region, Country)
        city:
          type: string
          description: City/town/village name
        region:
          type: string
          description: State or region name
        country:
          type: string
          description: Country name
        latitude:
          type: number
        longitude:
          type: number
        timezoneOffset:
          type: number
          description: UTC offset in hours
        timezone:
          type: string
          description: IANA zone name of the place from the server's offline table; a place without one is never answered (ADR-246, MB-30).
        placeType:
          type: string
          description: Nominatim place type (city, town, village, administrative, etc.)
      required:
        - name
        - latitude
        - longitude
        - timezoneOffset
        - timezone
        - placeType

    GeocodeSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/GeocodeResult"
      required:
        - results

    CreditBalance:
      type: object
      properties:
        available:
          type: integer
          description: Number of credits available to use
        used:
          type: integer
          description: Number of credits already consumed
      required: [available, used]

    CreditCounts:
      type: object
      description: One credit kind (ADR-42). The typed breakdown went with it; the columns drop with payments (MB-57).
      properties:
        available:
          type: integer
        used:
          type: integer
        held:
          type: integer
          description: Credits held for waiting gifts, outside available until claimed or returned (ADR-123).
        lastBundle:
          type: object
          nullable: true
          description: The newest bundle, which the path after buying plans from; null before any (ADR-125).
          properties:
            id: { type: string }
            count: { type: integer }
            createdAt: { type: string }
          required: [id, count, createdAt]
      required: [available, used]

    CreditHistoryItem:
      type: object
      description: One line of History, bought, a gift received, granted, refunded or spent (ADR-129, ADR-275, ADR-276).
      properties:
        kind:
          type: string
          enum: [bought, gift, spent, granted, refunded]
          description: "`granted` is credits Stars Decoded gave, a tester's grant or the yearly plan's credit (ADR-276, ADR-277); `refunded` is credits a refund or a dispute took back (ADR-275)."
        count:
          type: integer
          description: Credits the line moves, a positive number; bought, gift and granted add them, spent and refunded take them away.
        date: { type: string, description: "ISO-8601 timestamp of the line" }
        label:
          type: string
          description: What the line reads, "A gift from {giver}" on a gift, the report's name when spent, "Gift to {name}" on the giver's side once claimed, "From Stars Decoded" on a grant, "With Timeline" on the yearly plan's credit, "Refunded" on a refund (reading 4).
        test:
          type: boolean
          description: A test bundle's line, which says so (ADR-138).
      required: [kind, count, date, label, test]

    TestCheckoutBody:
      type: object
      description: A test bundle of 1, 3 or 5 credits (ADR-138).
      properties:
        count:
          type: integer
          enum: [1, 3, 5]
      required: [count]

    CatalogueItemId:
      type: string
      description: What the catalogue sells, the three bundles and Timeline's two plans; Single is solo here and single only as Stripe's lookup key (ADR-277).
      enum: [solo, couple, family, timeline_month, timeline_year]

    PriceItem:
      type: object
      description: One catalogue item at the price the server sets for this request (R-7.1, ADR-277, ADR-278).
      properties:
        id:
          $ref: "#/components/schemas/CatalogueItemId"
        kind:
          type: string
          enum: [bundle, plan]
        name:
          type: string
          description: The catalogue's name, "Couple" or "Timeline" (ADR-277).
        line:
          type: string
          nullable: true
          description: The catalogue's line under a bundle's name, word for word; null on a plan, which has none (ADR-277).
        credits:
          type: integer
          nullable: true
          description: The credits a bundle adds; null on a plan (ADR-277).
        interval:
          type: string
          enum: [month, year]
          nullable: true
          description: How often a plan renews; null on a bundle (ADR-277).
        cents:
          type: integer
          description: What this request pays, in euro cents; a live campaign's price while one runs (ADR-278).
        fullCents:
          type: integer
          description: The item's price without a campaign, struck through beside a campaign's price; never the Singles total, which the catalogue keeps (ADR-278, reading 6).
        campaign:
          description: The live campaign behind `cents`; null without one (ADR-278).
          type: object
          nullable: true
          properties:
            name:
              type: string
              description: The campaign's name, which Stripe's receipt also gives (ADR-278).
            endsOn:
              $ref: "#/components/schemas/CalendarDay"
              description: Its last day, in Europe/Brussels, printed once as "until {last day}" (reading 5, reading 6).
          required: [name, endsOn]
      required: [id, kind, name, line, credits, interval, cents, fullCents, campaign]

    CheckoutOptions:
      type: object
      description: What /checkout needs before Pay, every price for this request, Stripe's publishable key and whether checkout is ready (ADR-277, ADR-280).
      properties:
        publishableKey:
          type: string
          nullable: true
          description: Stripe's publishable key for this host, served from Railway so every Stripe key has one home; null without one (ADR-280).
        ready:
          type: boolean
          description: False while POST /checkout would answer 503, so the page says checkout isn't ready yet (reading 8, reading 14).
        items:
          type: array
          description: Every catalogue item in its order, the three bundles then Timeline's two plans (ADR-277).
          items:
            $ref: "#/components/schemas/PriceItem"
      required: [publishableKey, ready, items]

    CreateCheckoutBody:
      type: object
      description: One item to buy, under our tick, and the step to go back to (ADR-274).
      properties:
        item:
          $ref: "#/components/schemas/CatalogueItemId"
        ticked:
          type: boolean
          description: The reader ticked the box, CHECKOUT_TICK or PLAN_TICK for a plan; false is 400 `tick_required` (ADR-274).
        returnTo:
          type: string
          description: The step that asked, where the done page goes back to; one off the list `^/(chart|dashboard(/account)?(\?open=(credits|gift|add|pair))?|report/[0-9a-f-]{36})$` is 400 `bad_return`, so it is never an open redirect (reading 2).
        campaign:
          type: string
          description: A link-only campaign's slug the tab kept; one that names no live campaign changes no price (ADR-278).
      required: [item, ticked, returnTo]

    CheckoutStarted:
      type: object
      description: The purchase POST /checkout made and the session our /checkout page mounts Stripe's fields on (ADR-274).
      properties:
        purchaseId:
          type: string
          description: The purchase row, which GET /checkout/{purchaseId} reads (ADR-274).
        clientSecret:
          type: string
          description: The Checkout Session's client secret, which Stripe.js takes to mount the fields (ADR-274).
        amountCents:
          type: integer
          description: What Pay charges, in euro cents, set by the server (R-7.1, ADR-274).
      required: [purchaseId, clientSecret, amountCents]

    CheckoutState:
      type: object
      description: Where a purchase stands, read by the page that waits for its credit (ADR-274, ADR-275).
      properties:
        status:
          type: string
          enum: [open, granted, failed, expired, refunded]
          description: "`open` waits for the payment or the webhook; `granted` is in the balance, or the plan has started; `failed` and `expired` were never paid; `refunded` was taken back by a refund or a dispute (ADR-275)."
        item:
          $ref: "#/components/schemas/CatalogueItemId"
        returnTo:
          type: string
          description: The step that asked, as POST /checkout kept it (reading 2).
        credits:
          type: integer
          nullable: true
          description: The credits the purchase adds, a bundle's count; null on a plan (ADR-275).
      required: [status, item, returnTo, credits]

    OpenBillingPortalBody:
      type: object
      description: Where Stripe's Customer Portal sends the reader back (ADR-277).
      properties:
        returnTo:
          type: string
          description: A page on the same list as checkout's returnTo, the Account page; one off it is 400 `bad_return` (reading 2).
      required: [returnTo]

    BillingPortalOpened:
      type: object
      description: A Customer Portal session to open at once (ADR-277).
      properties:
        url:
          type: string
          description: Stripe's address for the session.
      required: [url]

    # A day is a string, never format: date, which the zod codegen's useDates would turn into a UTC Date and so lose
    # the reader's zone the day was read in.
    CalendarDay:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: A calendar day, YYYY-MM-DD, never a clock time; each field says whose day it is (ADR-207).

    Tone:
      type: string
      enum: [easy, mixed, intense]
      description: How an event tends to feel, from a fixed table of planet and aspect, never a score (ADR-207, MB-188).

    TimelineRange:
      type: string
      enum: [week, month, six-months]
      description: Now and ahead's range from today, 7, 30 or 182 days (ADR-207).

    ReadingStatus:
      type: string
      enum: [none, writing, ready, failed]
      description: Where the reading of an event or a cycle stands, none until it is opened or queued (ADR-210, MB-191).

    CycleId:
      type: string
      enum:
        - jupiter-return
        - jupiter-opposition
        - saturn-return
        - saturn-opposition
        - saturn-square
        - node-return
        - node-opposition
        - uranus-return
        - uranus-opposition
        - uranus-square
        - neptune-square
        - pluto-square
      description: A life cycle, as the engine names it (ADR-209).

    TimelineSpan:
      type: object
      description: One stretch an event is within orb, from coming into it to leaving it (ADR-207).
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      required: [start, end]

    TimelineEvent:
      type: object
      description: One sky event on the reader's own chart, its dates and degrees the engine's and its words plain (ADR-207, ADR-208).
      properties:
        key:
          type: string
          description: "{kind}.{body}.{aspect or -}.{target or -}.{yyyymmdd}, URL-safe and at most 80 characters, the same from any range that meets it (ADR-210)."
        kind:
          type: string
          enum: [contact, retrograde, eclipse]
          description: A slow planet within orb of a natal point, Mercury, Venus or Mars turning back, or an eclipse (ADR-208).
        body:
          type: string
          description: The moving body as the engine names it, "saturn"; an eclipse's is the sun or the moon eclipsed (ADR-208).
        aspect:
          type: string
          nullable: true
          description: A contact's aspect, conjunction, square, opposition or trine; null on a retrograde or an eclipse (ADR-208).
        target:
          type: string
          nullable: true
          description: The natal point a contact touches or an eclipse falls near, as the engine names it, "ascendant"; null otherwise (ADR-208).
        houses:
          type: array
          description: The whole-sign houses it touches, a retrograde's in the order it moves back through them; empty without a birth time (ADR-208, R-4.6).
          items:
            type: integer
            minimum: 1
            maximum: 12
        start:
          type: string
          format: date-time
          description: Its whole window's start, which may be before the range (ADR-207).
        end:
          type: string
          format: date-time
          description: Its whole window's end, which may be after the range (ADR-207).
        exact:
          type: array
          description: Each time it is exact, in order, two or three when a retrograde splits a contact; empty when it never is (ADR-207).
          items:
            type: string
            format: date-time
        spans:
          type: array
          description: The stretches it is within orb between start and end, a gap between two where it is out of orb (ADR-207).
          items:
            $ref: "#/components/schemas/TimelineSpan"
        orbNow:
          type: number
          nullable: true
          description: A contact's distance from exact today in degrees, while it is within orb; null otherwise (ADR-207).
        tone:
          description: Its tone; null on an eclipse far from every natal point (ADR-207, MB-188).
          anyOf:
            - $ref: "#/components/schemas/Tone"
            - type: "null"
        headline:
          type: string
          description: The engine's plain headline, which names no aspect (ADR-207).
        facts:
          type: object
          description: The facts line's parts from the engine, "Saturn on your Ascendant" and "1st house"; the web adds the dates (ADR-207).
          properties:
            sky:
              type: string
            house:
              type: string
              nullable: true
              description: Null without a birth time (R-4.6).
          required: [sky, house]
        line:
          type: string
          nullable: true
          description: The everyday line, the reading's own once it is written; null before (ADR-210).
        reading:
          $ref: "#/components/schemas/ReadingStatus"
      required: [key, kind, body, aspect, target, houses, start, end, exact, spans, orbNow, tone, headline, facts, line, reading]

    NatalPoint:
      type: object
      description: A natal body the dial draws inside the chart, at its ecliptic longitude (ADR-207).
      properties:
        body:
          type: string
          description: As the engine names it, "sun".
        lon:
          type: number
          description: Ecliptic longitude in degrees, 0 to 360.
        house:
          type: integer
          nullable: true
          minimum: 1
          maximum: 12
          description: Its whole-sign house; null without a birth time (R-4.6).
      required: [body, lon, house]

    Angles:
      type: object
      description: The Ascendant and the Midheaven in degrees of ecliptic longitude; the dial puts the Ascendant east, on the left (ADR-207).
      properties:
        ascendant:
          type: number
        midheaven:
          type: number
      required: [ascendant, midheaven]

    TimelineDay:
      type: object
      description: One of the reader's days with the tone of each event on it; a day with none is quiet (ADR-207, MB-188).
      properties:
        date:
          $ref: "#/components/schemas/CalendarDay"
        tones:
          type: array
          items:
            $ref: "#/components/schemas/Tone"
      required: [date, tones]

    TimelineChange:
      type: object
      description: Something that starts, peaks or eases next, a tap moving the dial to its day (ADR-207).
      properties:
        key:
          type: string
          description: The event's key.
        at:
          type: string
          format: date-time
        change:
          type: string
          enum: [starts, peaks, eases]
      required: [key, at, change]

    TimelineNow:
      type: object
      description: Now and ahead over one range, from today in the reader's zone (ADR-207).
      properties:
        range:
          $ref: "#/components/schemas/TimelineRange"
        from:
          $ref: "#/components/schemas/CalendarDay"
          description: Today, the reader's day (ADR-207).
        to:
          $ref: "#/components/schemas/CalendarDay"
          description: The range's last day, the reader's (ADR-207).
        zone:
          type: string
          description: The IANA zone the days are read in, the tz sent when the server can read it, else the birth place's (ADR-207).
        blind:
          type: boolean
          description: No birth time, so no angle, no house and no natal Moon contact, which the page says once (R-4.6).
        natal:
          type: array
          items:
            $ref: "#/components/schemas/NatalPoint"
        angles:
          description: Null without a birth time (R-4.6).
          anyOf:
            - $ref: "#/components/schemas/Angles"
            - type: "null"
        days:
          type: array
          description: Each day of the range in order (ADR-207).
          items:
            $ref: "#/components/schemas/TimelineDay"
        events:
          type: array
          description: Every event in effect on a day of the range, each with its whole window (ADR-207).
          items:
            $ref: "#/components/schemas/TimelineEvent"
        next:
          type: array
          description: What starts, peaks or eases next, soonest first (ADR-207).
          items:
            $ref: "#/components/schemas/TimelineChange"
      required: [range, from, to, zone, blind, natal, angles, days, events, next]

    LifeCycleView:
      type: object
      description: One life cycle on the reader's own chart, its dates the engine's and its words the engine's CYCLE_WORDS (ADR-209).
      properties:
        key:
          type: string
          description: cycle.{id}.{yyyymmdd}, the UTC day of its first exact pass, or of its window's start when it never is exact (ADR-210).
        id:
          $ref: "#/components/schemas/CycleId"
        body:
          type: string
          description: Its planet as the engine names it, "north_node" for the nodes.
        name:
          type: string
          description: Its name, "Saturn return".
        word:
          type: string
          description: Its plain word, "A reset".
        age:
          type: number
          description: Whole years at its first exact pass, or at its window's start when it never is exact.
        exact:
          type: array
          description: Its exact passes in order, two or three when a retrograde splits it.
          items:
            type: string
            format: date-time
        start:
          type: string
          format: date-time
          description: When its planet comes within orb.
        end:
          type: string
          format: date-time
          description: When it leaves the orb for the last time.
        past:
          type: boolean
          description: Its window closed before today.
        repeats:
          type: boolean
          description: It comes more than once in a life, so its card looks back to the last time (ADR-209).
        passes:
          type: integer
          description: How many times it is exact.
        reading:
          $ref: "#/components/schemas/ReadingStatus"
      required: [key, id, body, name, word, age, exact, start, end, past, repeats, passes, reading]

    KnownAge:
      type: object
      description: One of the four known ages Life opens on, with the reader's own dates and ring (ADR-209).
      properties:
        id:
          $ref: "#/components/schemas/CycleId"
        age:
          type: number
          description: The reader's age at it, in whole years.
        last:
          type: string
          format: date-time
          nullable: true
          description: When it last came; null when it has not come yet.
        next:
          type: string
          format: date-time
          nullable: true
          description: When it comes next; null when it does not come again by 90.
        progress:
          type: number
          description: How far round its planet has come since birth, today, 0 to 1, which the ring draws.
      required: [id, age, last, next, progress]

    LifeWave:
      type: object
      description: One slow planet's distance from its place at birth, month by month from birth to 90 (ADR-209).
      properties:
        body:
          type: string
          description: As the engine names it, "saturn".
        points:
          type: array
          items:
            type: object
            properties:
              age:
                type: number
                description: Years from birth.
              distance:
                type: number
                description: Degrees from its place at birth, 0 to 180.
            required: [age, distance]
      required: [body, points]

    TimelineLife:
      type: object
      description: Life from the reader's own chart, birth to 90, the four known ages first (ADR-209).
      properties:
        age:
          type: number
          description: The reader's age today in years, a fraction past their last birthday, which marks today on the waves (ADR-209).
        birth:
          type: string
          format: date-time
          description: The reader's own birth instant, from which each cycle's mark on the waves is aged (ADR-209).
        ages:
          type: array
          description: The four known ages (ADR-209).
          items:
            $ref: "#/components/schemas/KnownAge"
        cycles:
          type: array
          description: Every life cycle from birth to 90, in order (ADR-209).
          items:
            $ref: "#/components/schemas/LifeCycleView"
        waves:
          type: array
          description: Each slow planet's wave, the slowest last (ADR-209).
          items:
            $ref: "#/components/schemas/LifeWave"
      required: [age, birth, ages, cycles, waves]

    ReadingOnHouse:
      type: object
      description: A reading built on the reader's house card for this house (ADR-210).
      properties:
        kind:
          type: string
          enum: [house]
        house:
          type: integer
          minimum: 1
          maximum: 12
      required: [kind, house]

    ReadingOnChapter:
      type: object
      description: A reading built on the chapter of the reader's report whose claims cite the point most (ADR-210).
      properties:
        kind:
          type: string
          enum: [chapter]
        chapter:
          type: string
          description: The chapter's key in the report.
      required: [kind, chapter]

    TimelineReading:
      type: object
      description: The reading of an event or a life cycle, written once for the reader and kept (ADR-210, MB-191).
      properties:
        key:
          type: string
          description: The event's or the cycle's key.
        line:
          type: string
          description: The everyday line its card shows.
        body:
          type: string
          description: The reading.
        buildsOn:
          description: The part of the reader's Personal report it builds on, a house card or a chapter; null when none does (ADR-210).
          anyOf:
            - $ref: "#/components/schemas/ReadingOnHouse"
            - $ref: "#/components/schemas/ReadingOnChapter"
            - type: "null"
        writtenAt:
          type: string
          format: date-time
      required: [key, line, body, buildsOn, writtenAt]

    OpenedReading:
      type: object
      description: What opening a reading answers, ready with it, writing while it is written, or failed with its line (ADR-210, MB-191).
      properties:
        status:
          type: string
          enum: [ready, writing, failed]
        reading:
          description: The reading when ready; null otherwise.
          anyOf:
            - $ref: "#/components/schemas/TimelineReading"
            - type: "null"
        line:
          type: string
          nullable: true
          description: The line the sheet shows when it failed; null otherwise.
      required: [status, reading, line]

    AskUsage:
      type: object
      description: Ask's messages this UTC calendar month, a tapped choice included, shown always (ADR-263).
      properties:
        used:
          type: integer
          minimum: 0
        left:
          type: integer
          minimum: 0
        cap:
          type: integer
          minimum: 0
          description: The month's cap, 50 (ADR-213).
        resetsOn:
          $ref: "#/components/schemas/CalendarDay"
          description: The 1st of next month, UTC, when the count starts again (ADR-263).
      required: [used, left, cap, resetsOn]

    TimelineAccess:
      type: object
      description: The one access check's answer for the signed-in reader (ADR-262, ADR-277).
      properties:
        access:
          type: boolean
        source:
          type: string
          enum: [admin, subscription]
          nullable: true
          description: Where access comes from, the admin or a live Timeline plan; null without access (ADR-262, ADR-277).
        hasPersonalReport:
          type: boolean
          description: The reader has a finished Personal report of their own, whose chart Timeline reads (ADR-205).
        ask:
          description: Ask's use this month with access; null without (ADR-263).
          anyOf:
            - $ref: "#/components/schemas/AskUsage"
            - type: "null"
        plan:
          description: The reader's live Timeline plan; null, or left out, when they have none (ADR-277).
          anyOf:
            - $ref: "#/components/schemas/TimelinePlan"
            - type: "null"
      required: [access, source, hasPersonalReport, ask]

    TimelinePlan:
      type: object
      description: A live Timeline plan, the subscription that gives access while Stripe calls it active, trialing or past due (ADR-277, reading 7).
      properties:
        item:
          type: string
          enum: [timeline_month, timeline_year]
          description: Monthly or yearly, as the catalogue names the plan (ADR-277).
        status:
          type: string
          enum: [active, trialing, past_due]
          description: The subscription's status as Stripe names it; past_due while Stripe retries a payment that failed (reading 7).
        renewsOn:
          description: The day it renews, its period's end as a day in Europe/Brussels; null once it is set to end (reading 7).
          anyOf:
            - $ref: "#/components/schemas/CalendarDay"
            - type: "null"
        endsOn:
          description: The day access ends after a cancel at the period's end, as a day in Europe/Brussels; null while it renews (reading 7).
          anyOf:
            - $ref: "#/components/schemas/CalendarDay"
            - type: "null"
      required: [item, status, renewsOn, endsOn]

    Week:
      type: object
      description: Your week on the dashboard, seven days from today in the reader's zone (ADR-211).
      properties:
        headline:
          type: string
          nullable: true
          description: The week in one plain line from the engine's words; null when it has none (ADR-211).
        natal:
          type: array
          items:
            $ref: "#/components/schemas/NatalPoint"
        angles:
          description: Null without a birth time (R-4.6).
          anyOf:
            - $ref: "#/components/schemas/Angles"
            - type: "null"
        days:
          type: array
          description: The seven days with their tones (ADR-211).
          items:
            $ref: "#/components/schemas/TimelineDay"
        "on":
          type: array
          description: What touches the reader's chart this week (ADR-211).
          items:
            $ref: "#/components/schemas/TimelineEvent"
      required: [headline, natal, angles, days, "on"]

    TeaserCycle:
      type: object
      description: One of the four big cycles on the teaser, dated from the reader's own chart (ADR-212).
      properties:
        id:
          $ref: "#/components/schemas/CycleId"
        name:
          type: string
        word:
          type: string
        age:
          type: number
          description: The reader's age when it comes, in whole years.
        "on":
          $ref: "#/components/schemas/CalendarDay"
          description: The day it comes, its first exact pass (ADR-212).
      required: [id, name, word, age, "on"]

    Teaser:
      type: object
      description: Your life's big cycles, for a reader without Timeline, pointing to /timeline with no price (ADR-212, ADR-255).
      properties:
        saturn:
          type: object
          description: The Saturn ring, the age of the reader's Saturn return and how far round Saturn has come since birth, 0 to 1 (ADR-212).
          properties:
            age:
              type: number
            progress:
              type: number
          required: [age, progress]
        cycles:
          type: array
          description: The four big cycles, soonest first (ADR-212).
          items:
            $ref: "#/components/schemas/TeaserCycle"
      required: [saturn, cycles]

    AskDayCard:
      type: object
      description: A day's card, the contacts on the reader's chart that day and the Moon's sign and phase, the one place the Moon appears (ADR-213).
      properties:
        kind:
          type: string
          enum: [day]
        date:
          $ref: "#/components/schemas/CalendarDay"
        events:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"
        moon:
          type: object
          properties:
            sign:
              type: string
            phase:
              type: string
          required: [sign, phase]
      required: [kind, date, events, moon]

    AskWindowCard:
      type: object
      description: A window's card, at most six months, each day easy, mixed, intense or quiet (ADR-213, MB-188).
      properties:
        kind:
          type: string
          enum: [window]
        from:
          $ref: "#/components/schemas/CalendarDay"
        to:
          $ref: "#/components/schemas/CalendarDay"
        days:
          type: array
          items:
            type: object
            properties:
              date:
                $ref: "#/components/schemas/CalendarDay"
              tone:
                description: The tone most of its contacts hold, a tie to the more intense; null on a quiet day (MB-188).
                anyOf:
                  - $ref: "#/components/schemas/Tone"
                  - type: "null"
            required: [date, tone]
      required: [kind, from, to, days]

    AskCycleCard:
      type: object
      description: A life cycle's card, as Life shows it (ADR-213).
      properties:
        kind:
          type: string
          enum: [cycle]
        cycle:
          $ref: "#/components/schemas/LifeCycleView"
      required: [kind, cycle]

    AskQuoteCard:
      type: object
      description: A passage from a report the reader can read, put in word for word by the server, never written by the model (ADR-213).
      properties:
        kind:
          type: string
          enum: [quote]
        reportId:
          type: string
        reportName:
          type: string
        section:
          type: string
          description: The section of the report it comes from.
        text:
          type: string
      required: [kind, reportId, reportName, section, text]

    AskPersonCard:
      # MB-191 provisional: kept as who and which day, computed when shown, only while the reader can read them.
      type: object
      description: Someone in a Compatibility report the reader can read, on the day asked about, computed when shown (ADR-213, MB-191).
      properties:
        kind:
          type: string
          enum: [person]
        name:
          type: string
        date:
          $ref: "#/components/schemas/CalendarDay"
        events:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"
      required: [kind, name, date, events]

    AskCard:
      description: One computed card in Ask's answer, the same pieces as Timeline's (ADR-213).
      oneOf:
        - $ref: "#/components/schemas/AskDayCard"
        - $ref: "#/components/schemas/AskWindowCard"
        - $ref: "#/components/schemas/AskCycleCard"
        - $ref: "#/components/schemas/AskQuoteCard"
        - $ref: "#/components/schemas/AskPersonCard"

    AskChoice:
      type: object
      description: A choice Ask offers when it asks back; a tap sends its id (ADR-213).
      properties:
        id:
          type: string
        label:
          type: string
          description: The words on the button.
        kind:
          type: string
          enum: [date, window, person, report]
      required: [id, label, kind]

    AskMessage:
      type: object
      description: One message in the thread, the reader's or Ask's, Ask's with its cards and choices (ADR-213, MB-191).
      properties:
        id:
          type: string
        role:
          type: string
          enum: [reader, ask]
        text:
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/AskCard"
        choices:
          type: array
          items:
            $ref: "#/components/schemas/AskChoice"
        createdAt:
          type: string
          format: date-time
      required: [id, role, text, cards, choices, createdAt]

    AskThread:
      type: object
      description: The reader's thread from the last 31 days, oldest first, and Ask's count this month (ADR-213, ADR-263, MB-191).
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AskMessage"
        usage:
          $ref: "#/components/schemas/AskUsage"
      required: [messages, usage]

    SendAskBody:
      type: object
      description: A message to Ask, its text or a tapped choice, never both (ADR-213).
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: What the reader asks, 1 to 500 characters, never logged (ADR-201).
        choiceId:
          type: string
          description: A choice Ask offered in its last message.
        reportId:
          type: string
          description: The report page it was sent from, read only if the reader can read it (ADR-213).

    NoTimeline:
      type: object
      description: The 403 body of a Timeline or Ask route for a reader without Timeline (ADR-262, MB-197).
      properties:
        error:
          type: string
          enum: [no_timeline]
        message:
          type: string
      required: [error]

    AskCap:
      type: object
      description: The 429 body once the month's 50 messages are used, with the day the count starts again (ADR-263).
      properties:
        error:
          type: string
          enum: [ask_cap]
        message:
          type: string
          description: The one line the page shows, so its words live in the API.
        resetsOn:
          $ref: "#/components/schemas/CalendarDay"
          description: The 1st of next month, UTC (ADR-263).
      required: [error, message, resetsOn]
