openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Stars Decoded Natal Chart Report API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: reports
    description: Natal chart report operations
  - name: profiles
    description: Person/profile management ("My People")
  - name: synastry
    description: Relationships between two people, and the retired chart-to-chart synastry report (never listed, MB-58)
  - name: compatibility
    description: The compatibility report, written from two finished natal reports
  - name: horizon
    description: What a birth time settles, before anything is paid
  - name: invites
    description: The claim link behind Send and Gift, previewed and claimed by its recipient (ADR-120, ADR-139)
  - name: gifts
    description: Gift a report, a credit held for someone until they claim it (ADR-123, ADR-139)
  - name: credits
    description: One balance of credits, its History and the test checkout (ADR-129, ADR-138)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List all reports
      description: Returns the natal and compatibility reports visible to the viewer. Old synastry rows are never listed. Use the `kind` discriminator to distinguish.
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportSummary"
    post:
      operationId: createReport
      tags: [reports]
      summary: Create a new natal chart report
      description: Accepts birth data, computes the natal chart, and starts AI interpretation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportBody"
      responses:
        "201":
          description: Report created and generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"
        "400":
          description: Invalid birth data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a report by ID
      description: >
        Returns a report with its chart data and interpretation. A compatibility
        report carries `lens` and `participants` (both people with their charts)
        and its birth fields are the first participant's.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete a report
      description: >
        Deletes a report the viewer owns. The profile behind a natal report is
        deleted too when no other report or relationship references it. A
        compatibility report is deleted through the relationship's access roles.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Report deleted
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/{id}/status:
    get:
      operationId: getReportStatus
      tags: [reports]
      summary: Get report generation status
      description: Poll for the current generation status of a report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportStatus"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/{id}/workbook:
    patch:
      operationId: updateReportWorkbook
      tags: [reports]
      summary: Tick or untick workbook items on a report
      description: >
        Shallow-merges the patch into the report's workbook, the reader's own
        record of which actions they have taken. A string value is the ISO date
        of the tick, null removes the item. Returns the merged workbook. The
        viewer must own the report.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkbookPatch"
      responses:
        "200":
          description: The merged workbook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workbook"
        "400":
          description: Unusable item key or value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/{id}/regenerate:
    post:
      operationId: regenerateReport
      tags: [reports]
      summary: Regenerate a report's interpretation
      description: >
        Re-runs interpretation on the stored chart. Used for reports generated
        before the current prompt version. Rate-limited per report.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Regeneration started
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                required: [id, status]
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Report is already being generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Regenerated too recently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List the viewer's people (profiles)
      responses:
        "200":
          description: List of profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileSummary"
    post:
      operationId: createProfile
      tags: [profiles]
      summary: Create or de-dupe-resolve a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileBody"
      responses:
        "201":
          description: Profile created or matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profiles/{id}:
    patch:
      operationId: updateProfile
      tags: [profiles]
      summary: Update mutable profile fields
      description: >
        The owner toggles `isSelf`; setting `isSelf=true` automatically clears
        any other self-profile for the same user (one per user invariant). The
        claimer of a sent chart sets `claimedAsSelf`, This is me or Not me (ADR-120).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner of this profile, or for `claimedAsSelf` not its claimer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profiles/{id}/stop-sharing:
    post:
      operationId: stopSharingProfile
      tags: [profiles]
      summary: Stop sharing a sent chart with its giver
      description: The claimer's Stop sharing, which moves the sent report to their account and out of the giver's list at once (ADR-139).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The giver no longer reads it
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a chart sent to the viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profiles/{id}/birth-time:
    patch:
      operationId: updateProfileBirthTime
      tags: [profiles, horizon]
      summary: Add or correct the birth time and run the horizon pass
      description: >
        Owner only. Stores the new time and window on the profile, recomputes
        its chart, and runs a horizon pass on every complete report of the
        profile: the previous text is kept in report_revisions, the horizon
        sections are generated and the rest is amended by quote match, never
        regenerated (ADR-35). The first pass is free (MB-52).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBirthTimeBody"
      responses:
        "202":
          description: The pass has started on the listed reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BirthTimeUpdateResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found or not owned by the viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A pass is already running on one of the profile's reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /horizon/preview:
    post:
      operationId: previewHorizon
      tags: [horizon]
      summary: What the entered birth time settles
      description: >
        Sweeps the birth-time band with the engine and returns, per fact,
        whether it holds and where it flips. Pure of the database: nothing is
        stored, no profile is read, no model is called. Small enough to poll on
        every debounced change of the form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HorizonPreviewBody"
      responses:
        "200":
          description: The horizon facts across the band
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Horizon"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /compatibility:
    post:
      operationId: createCompatibilityReport
      tags: [compatibility]
      summary: Write a compatibility report from two finished natal reports
      description: >
        Both reports must be complete and visible to the viewer. Reads their
        stored interpretations and cached charts; no birth data is read and
        nothing is regenerated (ADR-39). The report streams through
        GET /reports/{id} and /reports/{id}/status like a natal report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompatibilityBody"
      responses:
        "201":
          description: Report created and generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompatibilityCreateResponse"
        "400":
          description: Validation error, or a report that is not complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: A report was not found or not visible to the viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /compatibility/{id}/scenes:
    post:
      operationId: writeScene
      tags: [compatibility]
      summary: Write one of a chapter's two unread scenes on tap
      description: >
        A lens chapter carries three curated scenes; the report wrote one. This
        writes another on the same chapter brief, once per report, chapter and
        index, stores it on the interpretation and serves the stored text on
        every later call (ADR-65, ADR-72). Access is the report's.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteSceneBody"
      responses:
        "200":
          description: The scene, written now or served from storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneResponse"
        "400":
          description: The chapter is not a lens chapter of this report, or the index is not one of its two unread scenes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /compatibility/{id}/summary:
    get:
      operationId: getCompatibilitySummary
      tags: [compatibility]
      summary: The two names, the lens and the status of a compatibility report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompatibilitySummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /compatibility/{id}/send:
    post:
      operationId: sendCompatibility
      tags: [compatibility]
      summary: Send a compatibility report to the other of its two people
      description: >
        Only one of the pair's two sends it, and the send is their consent (ADR-133, ADR-139):
        someone already on Stars Decoded reads it at once, anyone else is invited at `email`
        (MB-82). MB-103 provisional.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCompatibilityBody"
      responses:
        "201":
          description: Invited, or granted at once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairSendResult"
        "400":
          description: An unusable email, or none for someone not yet on Stars Decoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The viewer is not one of the pair's two (ADR-133)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /compatibility/{id}/stop-sharing:
    post:
      operationId: stopSharingCompatibility
      tags: [compatibility]
      summary: Stop sharing a compatibility report its sender sent
      description: The sender's Stop sharing, which ends the other person's access at once; nothing is deleted (ADR-139, MB-103 provisional).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The other person no longer reads it
        "404":
          description: Not a compatibility report the viewer sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /relationships:
    post:
      operationId: createRelationship
      tags: [synastry]
      summary: Create a relationship between two people
      description: Idempotent on the participant pair — re-posting returns the existing relationship.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRelationshipBody"
      responses:
        "200":
          description: Existing relationship returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipCreateResponse"
        "201":
          description: New relationship created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipCreateResponse"
        "400":
          description: Validation error
        "404":
          description: Profiles not owned by viewer
    get:
      operationId: listRelationships
      tags: [synastry]
      summary: List the viewer's relationships
      responses:
        "200":
          description: List of relationships with participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelationshipSummary"

  /relationships/{id}:
    get:
      operationId: getRelationship
      tags: [synastry]
      summary: Get a relationship by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Relationship with participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipSummary"
        "404":
          description: Not found

  /synastry:
    post:
      operationId: createSynastryReport
      tags: [synastry]
      summary: Create a synastry (two-person) report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSynastryBody"
      responses:
        "201":
          description: Synastry report created and generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynastryCreateResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: A profile was not owned by the viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /synastry/{id}:
    get:
      operationId: getSynastryReport
      tags: [synastry]
      summary: Get a synastry report by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: Optional signed invite token granting viewer access to a non-owner.
          schema:
            type: string
      responses:
        "200":
          description: Synastry report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynastryReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /synastry/{id}/status:
    get:
      operationId: getSynastryReportStatus
      tags: [synastry]
      summary: Poll synastry report status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: Optional signed invite token granting viewer access to a non-owner.
          schema:
            type: string
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynastryStatus"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /credits:
    get:
      operationId: getCredits
      tags: [credits]
      summary: Get the current user's credit counts
      description: One credit is one report, whatever the report (ADR-42). Returns the signed-in user's available, used and held counts and last bundle, zeros for anonymous users.
      responses:
        "200":
          description: Credit counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCounts"

  /credits/history:
    get:
      operationId: getCreditHistory
      tags: [credits]
      summary: What the viewer's credits did, newest first
      description: History's lines, bought, a gift received and spent (ADR-129); a test bundle's line says so (ADR-138). Empty for anonymous users.
      responses:
        "200":
          description: History lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditHistoryItem"

  /checkout/test:
    post:
      operationId: testCheckout
      tags: [credits]
      summary: Add a free test bundle of credits
      description: Get credits off production, 1, 3 or 5 credits free for any signed-in user, marked as test credits (ADR-138). MB-6 provisional until checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestCheckoutBody"
      responses:
        "201":
          description: The counts with the bundle added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCounts"
        "400":
          description: A count other than 1, 3 or 5
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: On production, where only a real checkout adds credits (ADR-138)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites:
    get:
      operationId: listInvites
      tags: [invites]
      summary: List active invites for a profile owned by the current viewer
      description: |
        Returns all unclaimed, unexpired invite tokens for the given profile.
        The caller must own the profile (i.e. be the owner by userId or sessionId).
        Ownership is the effective gate — all active invites for the profile are
        returned regardless of which session originally created them.
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: string
          description: Filter invites to those belonging to this profile
      responses:
        "200":
          description: List of active invite records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InviteRecord"
        "403":
          description: Not the owner of the profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createInvite
      tags: [invites]
      summary: Create an invite token and send the claim email
      description: Generates a single-use signed token tied to a profile (and optional relationship) and emails it to the recipient.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteBody"
      responses:
        "201":
          description: Invite created and email queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteSummary"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the owner of the profile/relationship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Profile is already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/{token}:
    get:
      operationId: getInvite
      tags: [invites]
      summary: Resolve an invite token to its preview metadata
      description: |
        Public endpoint used by the claim landing page to render the invite
        without requiring sign-in. A token that has already been claimed is
        still resolvable (so the landing page can show a "this invite was
        already accepted" state) and is signaled by `alreadyClaimed: true`
        in the response body. Tokens that do not exist or have expired
        return 404. A send's token lives 7 days and a gift's 30, expiry
        applied on read (ADR-123).
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite preview (may be already-claimed; check `alreadyClaimed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: Token not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/{token}/claim:
    post:
      operationId: claimInvite
      tags: [invites]
      summary: Claim an invite as the signed-in user
      description: >
        Requires Clerk authentication. A send marks the token claimed, sets
        profile.claimed_by_user_id, and adds the user as a participant on the
        related relationship. A gift moves its held credit into the claimer's
        balance and answers `redirectTo: /dashboard`; it puts no one on an
        orbit (ADR-139).
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteClaimResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Token not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gifts:
    get:
      operationId: listGifts
      tags: [gifts]
      summary: The viewer's gifts, waiting, claimed or returned
      description: What a giver sees of a gift, its state and nothing the recipient makes (ADR-139). Empty for anonymous users.
      responses:
        "200":
          description: The viewer's gifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gift"
    post:
      operationId: createGift
      tags: [gifts]
      summary: Gift a report
      description: Holds one of the giver's credits for 30 days and emails the cover with a claim link; the claim moves the credit into the recipient's balance (ADR-123, ADR-139).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGiftBody"
      responses:
        "201":
          description: The gift, waiting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gift"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: A gift needs an account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gifts/{id}/remind:
    post:
      operationId: remindGift
      tags: [gifts]
      summary: Remind the recipient of a waiting gift
      description: Mints a fresh claim link for the same gift and emails it; the gift keeps its return date (ADR-123).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Reminder sent
        "404":
          description: No waiting gift of the viewer's with this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Reminded too recently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gifts/{id}:
    delete:
      operationId: takeBackGift
      tags: [gifts]
      summary: Take a waiting gift back
      description: Its claim link stops working and the held credit returns to the giver's balance (ADR-123).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Taken back
        "404":
          description: No gift of the viewer's with this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /geocode:
    get:
      operationId: geocodePlace
      tags: [reports]
      summary: Geocode a place name to coordinates
      description: Converts a city/place name to latitude, longitude, and timezone
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Place name to geocode
      responses:
        "200":
          description: Geocoded place candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeSearchResponse"
        "404":
          description: Place not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    AdminKey:
      name: x-admin-key
      in: header
      required: false
      schema:
        type: string
      description: Shared-secret admin key. May also be passed as `?key=`.

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        env:
          type: string
          enum: [development, staging, production]
          description: Which deployment answered. The smoke check asserts it so a web origin cannot silently route to the wrong API.
        commit:
          type: string
          description: Git sha of the running build, when the platform injects one.
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    CreateReportBody:
      type: object
      properties:
        name:
          type: string
          description: Name of the person
        birthDate:
          type: string
          description: Birth date in YYYY-MM-DD format
        birthTime:
          type: string
          description: Birth time in HH:MM format (24h)
        birthPlace:
          type: string
          description: Birth place name (e.g. "Milan, Italy")
        latitude:
          type: number
          description: Latitude of birth place
        longitude:
          type: number
          description: Longitude of birth place
        timezoneOffset:
          type: number
          description: UTC offset in hours (e.g. 1 for CET). Used only when no `timezone` is given.
        timezone:
          type: string
          description: IANA zone name of the birth place. The offset in force at the birth instant derives from it (MB-48).
        birthTimeWindowMinutes:
          type: integer
          description: Half-width of the birth-time band around `birthTime`. 0 exact, 180 a part of the day, 720 unknown (ADR-33). Default 0.
        isForSelf:
          type: boolean
          description: >
            When true, the profile created (or resolved) for this report is
            explicitly flagged as the submitter's own self-profile. The server
            sets `isSelf=true` on the profile row. Only one self-profile per
            user is intended; this should only be sent from the "Generate My
            Chart" flow, not the "Add a Person" flow.
      required:
        - name
        - birthDate
        - birthTime
        - birthPlace
        - latitude
        - longitude
        - timezoneOffset

    Access:
      description: "The viewer's standing on a report: owner made it, claimed is its subject holding a sent report, participant was sent a pair (ADR-139; pairs MB-103 provisional)."
      type: string
      enum: [owner, claimed, participant]

    SendState:
      description: Where Send to {firstName} stands, on a finished natal report about someone else or a pair the viewer is one of (ADR-120, ADR-133, ADR-139).
      type: object
      properties:
        state:
          type: string
          enum: [can_send, can_grant, sent, joined]
          description: can_send asks for an email; can_grant gives a pair at once to someone already on Stars Decoded (MB-82); sent waits on the claim; joined means they have it, "Joined ✓".
        profileId:
          type: string
          description: The person it goes to, the report's subject or the pair's other person.
        relationshipId:
          type: string
          nullable: true
          description: The pair's relationship; null on a natal report.
        firstName:
          type: string
          description: The name the control prints, "Send to {firstName}".
      required: [state, profileId, relationshipId, firstName]

    ReportSummary:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [natal, compatibility]
          description: Natal rows describe a single profile; compatibility rows describe a relationship between two profiles.
        name:
          type: string
          description: Display name. For natal, the profile's name. For compatibility, "{A} & {B}".
        birthDate:
          type: string
          description: Only set for natal reports.
        birthTime:
          type: string
          description: Only set for natal reports.
        birthPlace:
          type: string
          description: Only set for natal reports.
        status:
          type: string
          enum: [pending, computing, interpreting, revising, complete, failed]
        horizon:
          type: string
          enum: [known, approximate, unknown]
          nullable: true
          description: The natal chart's horizon status, so a blind report's tile can carry the call to action.
        archetypeName:
          description: The report's overview headline (kept under its historical name for client compatibility). Null until the report completes.
          type: string
          nullable: true
        sunSign:
          type: string
          nullable: true
        moonSign:
          type: string
          nullable: true
        risingSign:
          type: string
          nullable: true
        profileId:
          type: string
          nullable: true
          description: Profile ID for natal reports. Null for compatibility reports.
        relationshipId:
          type: string
          nullable: true
          description: Set for compatibility reports.
        relationshipType:
          type: string
          nullable: true
          description: The lens (partners, parent_child, people). Set for compatibility reports.
        lens:
          $ref: "#/components/schemas/RelationshipType"
          nullable: true
        participants:
          type: array
          description: Participant summaries. Set for compatibility reports.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              sunSign:
                type: string
                nullable: true
              moonSign:
                type: string
                nullable: true
              risingSign:
                type: string
                nullable: true
            required:
              - id
              - name
        createdAt:
          type: string
        failureReason:
          $ref: "#/components/schemas/FailureReason"
          nullable: true
        access:
          $ref: "#/components/schemas/Access"
          description: The viewer's standing on this report (ADR-139).
        send:
          description: Send to {name} on this row; null where it is not offered (ADR-120, ADR-133).
          anyOf:
            - $ref: "#/components/schemas/SendState"
            - type: "null"
        sharedBy:
          type: string
          nullable: true
          description: First name of whoever sent this report to the viewer; null when the viewer made it (ADR-139).
        stoppedBy:
          type: string
          nullable: true
          description: On a closed pair, the first name of whoever stopped sharing a natal report it came from; null while it reads (MB-103 provisional).
      required:
        - id
        - kind
        - name
        - status
        - createdAt

    FailureReason:
      type: object
      description: Why a failed report failed, as the customer reads it. Null unless the status is failed.
      properties:
        code:
          type: string
          enum: [provider_unreachable, provider_out_of_credit, quality, internal]
        line:
          type: string
          description: The plain line the customer reads.
      required: [code, line]

    ReportStatus:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, computing, interpreting, revising, complete, failed]
        errorMessage:
          type: string
          nullable: true
          description: Always null; internal text never reaches a customer response. Kept so older clients build.
        failureReason:
          $ref: "#/components/schemas/FailureReason"
          nullable: true
        chartReady:
          description: The chart is stored, so the report page can open on the hero and the explorer.
          type: boolean
        provisional:
          description: >
            While the chart is not yet stored: every body's position on the
            entered date and time at offset zero, from one local call, so the
            orrery can run from the birth day (ADR-47). Null once the chart
            exists, or when the profile is gone.
          type: object
          nullable: true
          properties:
            bodies:
              type: object
              additionalProperties:
                type: object
                properties:
                  absoluteDegree:
                    type: number
                  retrograde:
                    type: boolean
                required: [absoluteDegree, retrograde]
          required: [bodies]
        sections:
          description: One entry per section of the report's type, "done" once that section is stored.
          type: object
          additionalProperties:
            type: string
            enum: [pending, done]
        interpretation:
          description: The interpretation so far. Sections appear as each call lands.
          $ref: "#/components/schemas/ReportInterpretation"
          nullable: true
      required:
        - id
        - status
        - chartReady
        - sections

    PlanetPosition:
      type: object
      properties:
        sign:
          type: string
        degree:
          type: number
        absoluteDegree:
          type: number
        house:
          type: integer
          description: Whole-sign house. Absent when the horizon is unknown.
        retrograde:
          type: boolean
        speed:
          type: number
        band:
          description: Sun and Moon only, when the birth time is a band. Absolute degrees at the band's two ends.
          type: object
          properties:
            fromDegree:
              type: number
            toDegree:
              type: number
          required: [fromDegree, toDegree]
      required:
        - sign
        - degree
        - absoluteDegree
        - retrograde
        - speed

    HorizonFact:
      description: One fact the birth hour decides, swept across the band at two-minute steps.
      type: object
      properties:
        value:
          type: string
          description: The value at the centre time.
        holds:
          type: boolean
          description: True when the value never changed across the band.
        flipsAt:
          type: array
          description: Local times (HH:MM) inside the band at which the value changed.
          items:
            type: string
        values:
          type: array
          description: The sequence of values across the band.
          items:
            type: string
        holdsFrom:
          type: string
          description: Where the centre value's run within the birth day begins (HH:MM).
        holdsTo:
          type: string
          description: Where it ends (HH:MM, or 24:00).
      required: [value, holds, flipsAt, values, holdsFrom, holdsTo]

    Horizon:
      description: The horizon as a status, never a guess (ADR-33).
      type: object
      properties:
        status:
          type: string
          enum: [known, approximate, unknown]
        ascendant:
          $ref: "#/components/schemas/HorizonFact"
        midheaven:
          $ref: "#/components/schemas/HorizonFact"
        sect:
          $ref: "#/components/schemas/HorizonFact"
        moonSign:
          $ref: "#/components/schemas/HorizonFact"
        sunSign:
          $ref: "#/components/schemas/HorizonFact"
      required: [status, ascendant, midheaven, sect, moonSign, sunSign]

    HorizonPreviewBody:
      type: object
      properties:
        birthDate:
          type: string
        birthTime:
          type: string
          description: The band's centre, HH:MM.
        birthTimeWindowMinutes:
          type: integer
        latitude:
          type: number
        longitude:
          type: number
        timezone:
          type: string
          description: IANA zone name. Preferred over `timezoneOffset`.
        timezoneOffset:
          type: number
      required: [birthDate, birthTime, birthTimeWindowMinutes, latitude, longitude]

    UpdateBirthTimeBody:
      type: object
      properties:
        birthTime:
          type: string
        birthTimeWindowMinutes:
          type: integer
      required: [birthTime, birthTimeWindowMinutes]

    BirthTimeUpdateResponse:
      type: object
      properties:
        profileId:
          type: string
        horizon:
          type: string
          enum: [known, approximate, unknown]
        reportIds:
          type: array
          description: The reports a pass has started on.
          items:
            type: string
      required: [profileId, horizon, reportIds]

    Angle:
      type: object
      properties:
        sign:
          type: string
        degree:
          type: number
        absoluteDegree:
          type: number
      required:
        - sign
        - degree
        - absoluteDegree

    Aspect:
      type: object
      properties:
        planet1:
          type: string
        planet2:
          type: string
        type:
          type: string
        orb:
          type: number
        applying:
          type: boolean
      required:
        - planet1
        - planet2
        - type
        - orb
        - applying

    ChartData:
      type: object
      properties:
        datetimeUtc:
          type: string
        julianDay:
          type: number
        latitude:
          type: number
        longitude:
          type: number
        timezoneOffset:
          type: number
        timezone:
          type: string
        windowMinutes:
          type: integer
          description: Half-width of the birth-time band. 0 for an exact time.
        horizon:
          $ref: "#/components/schemas/Horizon"
        sunAltitude:
          type: number
          description: True altitude of the Sun's centre at birth. Absent when the horizon is unknown.
        planets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PlanetPosition"
        angles:
          description: Absent when the horizon is unknown.
          type: object
          properties:
            ascendant:
              $ref: "#/components/schemas/Angle"
            midheaven:
              $ref: "#/components/schemas/Angle"
            descendant:
              $ref: "#/components/schemas/Angle"
            ic:
              $ref: "#/components/schemas/Angle"
          required:
            - ascendant
            - midheaven
            - descendant
            - ic
        houses:
          description: Absent when the horizon is unknown.
          type: object
          additionalProperties:
            type: object
            properties:
              sign:
                type: string
              degree:
                type: number
            required:
              - sign
              - degree
        aspects:
          type: array
          items:
            $ref: "#/components/schemas/Aspect"
        elements:
          type: object
          properties:
            fire:
              type: integer
            earth:
              type: integer
            air:
              type: integer
            water:
              type: integer
          required:
            - fire
            - earth
            - air
            - water
        modalities:
          type: object
          properties:
            cardinal:
              type: integer
            fixed:
              type: integer
            mutable:
              type: integer
          required:
            - cardinal
            - fixed
            - mutable
        dominance:
          type: object
          properties:
            dominantPlanets:
              type: array
              items:
                type: string
            dominantElement:
              type: string
            dominantModality:
              type: string
          required:
            - dominantPlanets
            - dominantElement
            - dominantModality
        chartShape:
          type: string
          nullable: true
        hemisphereEmphasis:
          type: object
          properties:
            northern:
              type: integer
            southern:
              type: integer
            eastern:
              type: integer
            western:
              type: integer
          required:
            - northern
            - southern
            - eastern
            - western
      required:
        - datetimeUtc
        - julianDay
        - latitude
        - longitude
        - timezoneOffset
        - horizon
        - planets
        - aspects
        - elements
        - modalities
        - dominance

    EvidenceRef:
      description: >
        A structured reference to the chart, verified by the API before storage.
        Fields vary by kind. `cross` and `source` belong to the compatibility
        report: a cross-chart aspect or overlay, and a claim in one of the two
        natal reports (ADR-44).
      type: object
      properties:
        kind:
          type: string
          enum: [placement, aspect, ruler, lot, sect, angle, cross, source]
      required: [kind]
      additionalProperties: true

    StoredEvidence:
      type: object
      properties:
        ref:
          $ref: "#/components/schemas/EvidenceRef"
        label:
          description: Composed by the API from the verified reference; never model text.
          type: string
      required: [ref, label]

    Claim:
      description: A verbatim quote from the section's prose and the chart facts it rests on.
      type: object
      properties:
        quote:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/StoredEvidence"
      required: [quote, evidence]

    ActionItem:
      type: object
      properties:
        action:
          type: string
        why:
          type: string
      required: [action, why]

    ListedItem:
      description: A named item and the concrete reason this chart fits it.
      type: object
      properties:
        item:
          type: string
        reason:
          type: string
      required: [item, reason]

    HouseReading:
      description: One generated house-card reading, 40 to 70 words, ending on a behaviour check.
      type: object
      properties:
        house:
          type: integer
        reading:
          type: string
      required: [house, reading]

    Workbook:
      description: The reader's ticked items on a report, keyed by item, valued by the ISO date of the tick.
      type: object
      additionalProperties:
        type: string

    WorkbookPatch:
      description: >
        A shallow merge onto the report's workbook. A string value is the ISO
        date the reader ticked the item, null unticks it. A key is a section id,
        a dot path and an index, for example "career.actions.0".
      type: object
      minProperties: 1
      maxProperties: 200
      additionalProperties:
        type: string
        nullable: true

    ReportTriadPart:
      type: object
      properties:
        label:
          type: string
        text:
          type: string
      required: [label, text]

    ReportSuperpowerItem:
      type: object
      properties:
        title:
          type: string
        text:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionItem"
      required: [title, text, actions]

    ReportFocusGroup:
      type: object
      properties:
        intro:
          type: string
        bullets:
          type: array
          items:
            type: object
            properties:
              point:
                type: string
              why:
                type: string
            required: [point, why]
      required: [intro, bullets]

    UsageTotals:
      description: Token counts and time, summed over one section's attempts or a whole report.
      type: object
      properties:
        attempts:
          description: Calls made. Above one when a reply was rejected and retried.
          type: number
        inputTokens:
          type: number
        cachedInputTokens:
          type: number
        outputTokens:
          type: number
        reasoningTokens:
          type: number
        ms:
          type: number
      required: [attempts, inputTokens, cachedInputTokens, outputTokens, reasoningTokens, ms]

    PairCard:
      description: "The side-by-side card of a lens chapter: three lines a side in that person's own words, one for the pair (ADR-63)."
      type: object
      properties:
        a:
          type: array
          items:
            type: string
        b:
          type: array
          items:
            type: string
        pair:
          type: string
      required: [a, b, pair]

    PairNextTimeItem:
      type: object
      properties:
        for:
          type: string
          enum: [A, B, both]
        action:
          type: string
        why:
          type: string
      required: [for, action, why]

    PairLensChapter:
      description: "Chapters 02 to 06 under every lens: the workbook chapter (ADR-63, ADR-64)."
      type: object
      properties:
        headline:
          type: string
        card:
          $ref: "#/components/schemas/PairCard"
        scene:
          type: string
        whatJustHappened:
          type: object
          properties:
            becauseA:
              type: string
            becauseB:
              type: string
          required: [becauseA, becauseB]
        pattern:
          type: string
        nextTime:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PairNextTimeItem"
          required: [items]
        claims:
          type: array
          items:
            $ref: "#/components/schemas/Claim"
      required: [headline, card, scene, whatJustHappened, pattern, nextTime, claims]

    PairTwoCharts:
      description: Chapter 01, Your two charts, the introduction under the wheel (ADR-63).
      type: object
      properties:
        headline:
          type: string
        strong:
          type: array
          items:
            type: string
        work:
          type: array
          items:
            type: string
        paradox:
          type: string
        strengths:
          type: array
          items:
            type: string
        pointer:
          type: string
        claims:
          type: array
          items:
            $ref: "#/components/schemas/Claim"
      required: [headline, strong, work, paradox, strengths, pointer, claims]

    PairChapterScenes:
      description: "A lens chapter's three scenes: the titles, the index the report wrote, and the texts written on tap since (ADR-65, ADR-72)."
      type: object
      properties:
        titles:
          type: array
          items:
            type: string
        written:
          type: integer
        texts:
          type: object
          additionalProperties:
            type: string
      required: [titles, written, texts]

    PairChecklist:
      type: object
      properties:
        intro:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActionItem"
      required: [intro, items]

    PairPractise:
      description: Chapter 07 of the compatibility report, three checklists collected from the lens chapters and a closing paragraph.
      type: object
      properties:
        opening:
          type: string
        forA:
          $ref: "#/components/schemas/PairChecklist"
        forB:
          $ref: "#/components/schemas/PairChecklist"
        forBoth:
          $ref: "#/components/schemas/PairChecklist"
        closing:
          type: string
        claims:
          type: array
          items:
            $ref: "#/components/schemas/Claim"
      required: [opening, forA, forB, forBoth, closing, claims]

    PairLink:
      description: One generated link card, 40 to 70 words, ending on a behaviour check (ADR-43).
      type: object
      properties:
        kind:
          type: string
          enum: [flows, rubs, overlay]
        planetA:
          type: string
        planetB:
          type: string
        aspect:
          type: string
        orb:
          type: number
        planet:
          type: string
          description: Overlay cards, the body that sits in the other chart's house.
        of:
          type: string
          enum: [A, B]
        house:
          type: integer
        reading:
