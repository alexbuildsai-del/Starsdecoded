openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Stars Decoded Natal Chart Report API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: reports
    description: Natal chart report operations
  - name: home
    description: The dashboard's one read, the reader's circle, pairs and practice (ADR-174)
  - name: profiles
    description: Person/profile management ("My People")
  - name: synastry
    description: Relationships between two people, and the retired chart-to-chart synastry report (never listed, MB-58)
  - name: compatibility
    description: The compatibility report, written from two finished natal reports
  - name: horizon
    description: What a birth time settles, before anything is paid
  - name: invites
    description: The claim link behind Send and Gift, previewed and claimed by its recipient (ADR-120, ADR-139)
  - name: gifts
    description: Gift a report, a credit held for someone until they claim it (ADR-123, ADR-139)
  - name: shares
    description: Share my report, the reader's own Personal report read through a grant until its sharer stops (ADR-235)
  - name: credits
    description: One balance of credits, its History and the test checkout (ADR-129, ADR-138)
  - name: checkout
    description: Our /checkout page over Stripe's fields, the return's state and the Customer Portal (ADR-274, ADR-277)
  - name: waitlist
    description: The pre-launch list production collects until Stars Decoded opens
  - name: timeline
    description: Timeline, the sky across the reader's own chart, Now and ahead, Life and their readings, behind one access check (ADR-207, ADR-209, ADR-262)
  - name: ask
    description: Ask, the chat about the reader's chart, reports and timeline, 50 messages a month (ADR-213, ADR-263)
paths:
  # /csp-report is left out on purpose: browsers post their CSP violation reports
  # to it on their own and the generated client never calls it, as with /admin/*,
  # which the admin pages reach through their own fetch (ADR-198).
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join the pre-launch waitlist
      description: >
        Stores an email address to write to when Stars Decoded opens (ADR-141).
        Answers the same whether the address is new or already listed, so it
        cannot be used to learn who signed up. Sets no cookie and reads no
        account. A filled `website` field is a form-filling bot: it is answered
        the same and nothing is stored.
        Double opt-in (ADR-145): the address counts once its owner confirms it
        through the emailed link, at POST /waitlist/confirm; an address left
        unconfirmed is deleted after seven days, and a new link goes to the
        same address at most once in ten minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinWaitlistBody"
      responses:
        "200":
          description: The same answer for a new, waiting or confirmed address, so nobody learns who is listed (ADR-145)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistJoined"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many sign-ups from one address in a short time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "`waitlist_closed`: production takes no address until the privacy page names its controller and a contact address (ADR-145)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /waitlist/confirm:
    post:
      operationId: confirmWaitlist
      tags: [waitlist]
      summary: Confirm a waitlist address from its emailed link
      description: >
        Double opt-in (ADR-145): the page the emailed link opens posts the
        link's token here, so a mail scanner that fetches the link confirms
        nothing. A link lives seven days. Sets no cookie and reads no account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmWaitlistBody"
      responses:
        "200":
          description: The address is confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistConfirmed"
        "404":
          description: No address waits on this token, or its seven days are over (ADR-145)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /home:
    get:
      operationId: getHome
      tags: [home]
      summary: The dashboard's one read (ADR-174)
      description: >
        Everything the dashboard shows in one call, so no card loads a report
        to open: the reader's circle with each person's birth date and Sun,
        Moon and Rising, their quick looks, their pairs and stories, and what
        they are practising (ADR-174). The circle is the reader plus everyone
        whose Personal report they can read, the people GET /reports lists
        (ADR-182). A reader with Timeline gets `week`, Your week in their own
        days; a reader without it whose own Personal report is finished gets
        `teaser`; anyone else neither (ADR-211, ADR-212, ADR-262).
      parameters:
        - $ref: "#/components/parameters/ReaderZone"
      responses:
        "200":
          description: The reader's home (ADR-174)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List all reports
      description: Returns the natal and compatibility reports visible to the viewer. Old synastry rows are never listed. Use the `kind` discriminator to distinguish.
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportSummary"
    post:
      operationId: createReport
      tags: [reports]
      summary: Create a new natal chart report
      description: Accepts birth data, computes the natal chart, and starts AI interpretation; a credit is taken before anything is written, and with none it answers 402 (ADR-275).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportBody"
      responses:
        "201":
          description: Report created and generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"
        "400":
          description: Invalid birth data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "402":
          $ref: "#/components/responses/NoCredit"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Paused"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a report by ID
      description: >
        Returns a report with its chart data and interpretation. A compatibility
        report carries `lens` and `participants` (both people with their charts)
        and its birth fields are the first participant's.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete a report
      description: >
        Deletes a report the viewer owns. The profile behind a natal report is
        deleted too when no other report or relationship references it. A
        compatibility report is deleted through the relationship's access roles.
        Deleting the viewer's own Personal report ends their sharing of it in
        the same transaction, its grants and waiting share links revoked as Stop
        sharing revokes them (ADR-235).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Report deleted
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/{id}/status:
    get:
      operationId: getReportStatus
      tags: [reports]
      summary: Get report generation status
      description: Poll for the current generation status of a report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportStatus"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/{id}/workbook:
    patch:
      operationId: updateReportWorkbook
      tags: [reports]
      summary: Tick or untick workbook items on a report
      description: >
        Shallow-merges the patch into the viewer's own workbook on the report,
        their record of which actions they have taken. Every reader of the
        report, its writer, the person it was sent to or a reader through a
        grant, keeps their own ticks and pins, and no one else's show (ADR-239).
        A string value is the ISO date of the tick, null removes the item.
        Returns the merged workbook. A pin key pins its item to What you're
        practising the same way, three pins a workbook at most (ADR-174,
        ADR-239).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkbookPatch"
      responses:
        "200":
          description: The merged workbook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workbook"
        "400":
          description: >
            Unusable item key or value, or a patch that would leave a fourth
            pin on the report, which answers { "error": "pin_limit" } (ADR-174)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/{id}/regenerate:
    post:
      operationId: regenerateReport
      tags: [reports]
      summary: Regenerate a report's interpretation
      description: >
        Re-runs interpretation on the stored chart, free, for whoever may
        rewrite the report, as `canRegenerate` says (MB-169), and only where a
        rewrite is wanted: a failed report (Try again), an outdated one
        (MB-170), or one written on an earlier prompt version. Try again takes
        no credit: a failed report keeps the one it took, and after its third
        failure that credit is back in the balance and the report is final,
        with no Try again (ADR-313). Its 429 is the writing limit, or a second
        regenerate of the same report within a minute, which sends Retry-After
        but no `retryAfterSeconds` in its body.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Regeneration started
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                required: [id, status]
        "404":
          description: Report not found, or not a Personal report the viewer may regenerate (MB-169)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            `in_progress`: the report is already being written. `up_to_date`:
            a finished report on the current prompt version, written for its
            profile's birth time, needs no rewrite ("This report is already up
            to date"; MB-170). A final report, its credit back after its third
            failure, has no Try again and answers 409 too (ADR-313).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Paused"

  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List the viewer's people (profiles)
      responses:
        "200":
          description: List of profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileSummary"
    post:
      operationId: createProfile
      tags: [profiles]
      summary: Create or de-dupe-resolve a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileBody"
      responses:
        "201":
          description: Profile created or matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profiles/{id}:
    patch:
      operationId: updateProfile
      tags: [profiles]
      summary: Update mutable profile fields
      description: >
        The owner toggles `isSelf`; setting `isSelf=true` automatically clears
        any other self-profile for the same user (one per user invariant). The
        claimer of a sent chart sets `claimedAsSelf`, This is me or Not me (ADR-120).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner of this profile, or for `claimedAsSelf` not its claimer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profiles/{id}/stop-sharing:
    post:
      operationId: stopSharingProfile
      tags: [profiles]
      summary: Stop sharing a sent chart with its giver
      description: The claimer's Stop sharing, which moves the sent report to their account and out of the giver's list at once (ADR-139).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The giver no longer reads it
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a chart sent to the viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profiles/{id}/hand-back:
    post:
      operationId: handBackProfile
      tags: [profiles]
      summary: Hand a sent chart back to whoever sent it
      description: >
        Not me's Hand it back (ADR-236, MB-103), the claimer's alone and in one
        transaction: the claim ends, that profile's participant grants return to
        its writer, and the send is stamped handed back, so the writer's row
        reads "Handed back" with Send again.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Handed back to its writer (ADR-236)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandBackResponse"
        "404":
          description: No chart of this id the viewer may hand back (ADR-236)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`not_claimed`: the chart is not claimed from a send, so there is nothing to hand back (ADR-236)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profiles/{id}/birth-time:
    patch:
      operationId: updateProfileBirthTime
      tags: [profiles, horizon]
      summary: Add or correct the birth time and run the horizon pass
      description: >
        Its owner, or whoever claimed it as their own, only. Stores the new time
        and window on the profile, recomputes its chart, and runs a horizon pass
        on the newest complete Personal report of the profile: the previous text
        is kept in report_revisions, the horizon sections are generated and the
        rest is amended by quote match, never regenerated (ADR-35). Its older
        complete reports keep their text and read as outdated, which Regenerate
        rewrites free (MB-170). The first pass is free (MB-52).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBirthTimeBody"
      responses:
        "202":
          description: The pass has started on the listed report, or on none (MB-170)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BirthTimeUpdateResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found or not owned by the viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A pass is already running on one of the profile's reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Paused"

  /horizon/preview:
    post:
      operationId: previewHorizon
      tags: [horizon]
      summary: What the entered birth time settles
      description: >
        Sweeps the birth-time band with the engine and returns, per fact,
        whether it holds and where it flips. Pure of the database: nothing is
        stored, no profile is read, no model is called. Small enough to poll on
        every debounced change of the form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HorizonPreviewBody"
      responses:
        "200":
          description: The horizon facts across the band
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Horizon"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /compatibility:
    post:
      operationId: createCompatibilityReport
      tags: [compatibility]
      summary: Write a compatibility report from two finished natal reports
      description: >
        Both reports must be complete and visible to the viewer. Reads their
        stored interpretations and cached charts; no birth data is read and
        nothing is regenerated (ADR-39). The report streams through
        GET /reports/{id} and /reports/{id}/status like a natal report. A
        credit is taken before anything is written, and with none it answers
        402 (ADR-275).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompatibilityBody"
      responses:
        "201":
          description: Report created and generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompatibilityCreateResponse"
        "400":
          description: Validation error, or a report that is not complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: A report was not found or not visible to the viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "402":
          $ref: "#/components/responses/NoCredit"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Paused"

  /compatibility/{id}/summary:
    get:
      operationId: getCompatibilitySummary
      tags: [compatibility]
      summary: The two names, the lens and the status of a compatibility report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompatibilitySummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /compatibility/{id}/send:
    post:
      operationId: sendCompatibility
      tags: [compatibility]
      summary: Send a compatibility report to the other of its two people
      description: >
        Only one of the pair's two sends it, and the send is their consent (ADR-133, ADR-139):
        someone already on Stars Decoded reads it at once, anyone else is invited at `email`
        (MB-82, ADR-236).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCompatibilityBody"
      responses:
        "201":
          description: Invited, or granted at once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairSendResult"
        "400":
          description: An unusable email, or none for someone not yet on Stars Decoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The viewer is not one of the pair's two (ADR-133)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /compatibility/{id}/stop-sharing:
    post:
      operationId: stopSharingCompatibility
      tags: [compatibility]
      summary: Stop sharing a compatibility report its sender sent
      description: The sender's Stop sharing, which ends the other person's access at once; nothing is deleted (ADR-139, ADR-236).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The other person no longer reads it
        "404":
          description: Not a compatibility report the viewer sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /relationships:
    post:
      operationId: createRelationship
      tags: [synastry]
      summary: Create a relationship between two people
      description: Idempotent on the participant pair — re-posting returns the existing relationship.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRelationshipBody"
      responses:
        "200":
          description: Existing relationship returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipCreateResponse"
        "201":
          description: New relationship created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipCreateResponse"
        "400":
          description: Validation error
        "404":
          description: Profiles not owned by viewer
    get:
      operationId: listRelationships
      tags: [synastry]
      summary: List the viewer's relationships
      responses:
        "200":
          description: List of relationships with participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelationshipSummary"

  /relationships/{id}:
    get:
      operationId: getRelationship
      tags: [synastry]
      summary: Get a relationship by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Relationship with participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipSummary"
        "404":
          description: Not found

  /synastry:
    post:
      operationId: createSynastryReport
      tags: [synastry]
      summary: Create a synastry (two-person) report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSynastryBody"
      responses:
        "201":
          description: Synastry report created and generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynastryCreateResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: A profile was not owned by the viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Paused"

  /synastry/{id}:
    get:
      operationId: getSynastryReport
      tags: [synastry]
      summary: Get a synastry report by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: Optional signed invite token granting viewer access to a non-owner.
          schema:
            type: string
      responses:
        "200":
          description: Synastry report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynastryReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /synastry/{id}/status:
    get:
      operationId: getSynastryReportStatus
      tags: [synastry]
      summary: Poll synastry report status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: Optional signed invite token granting viewer access to a non-owner.
          schema:
            type: string
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynastryStatus"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /credits:
    get:
      operationId: getCredits
      tags: [credits]
      summary: Get the current user's credit counts
      description: One credit is one report, whatever the report (ADR-42). Returns the signed-in user's available, used and held counts and last bundle, zeros for anonymous users.
      responses:
        "200":
          description: Credit counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCounts"

  /credits/history:
    get:
      operationId: getCreditHistory
      tags: [credits]
      summary: What the viewer's credits did, newest first
      description: History's lines, bought, a gift received, granted, refunded and spent (ADR-129, ADR-275, ADR-276); a test bundle's line says so (ADR-138). Empty for anonymous users.
      responses:
        "200":
          description: History lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditHistoryItem"

  /checkout/test:
    post:
      operationId: testCheckout
      tags: [credits]
      summary: Add a free test bundle of credits
      description: Get credits off production, 1, 3 or 5 credits free for any signed-in user, marked as test credits (ADR-138). MB-6 provisional until checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestCheckoutBody"
      responses:
        "201":
          description: The counts with the bundle added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCounts"
        "400":
          description: A count other than 1, 3 or 5
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: On production, where only a real checkout adds credits (ADR-138)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /checkout/options:
    get:
      operationId: getCheckoutOptions
      tags: [checkout]
      summary: What each item costs on this request, and whether checkout is ready
      description: Every catalogue item at the price the server sets for this request, a live campaign's included, with Stripe's publishable key and whether checkout is ready; answers anyone and writes nothing (ADR-277, ADR-278, ADR-280).
      parameters:
        - name: c
          in: query
          required: false
          schema:
            type: string
          description: A link-only campaign's slug, from the `?c=` its link carried and the tab kept; one that names no live campaign changes no price (ADR-278).
      responses:
        "200":
          description: The prices, the key and whether checkout is ready (ADR-277, ADR-280)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutOptions"

  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Start a Checkout Session for one item under our tick
      description: Makes the purchase row with the tick's hash and time and a Checkout Session in Stripe's `elements` mode at the server's price, for the signed-in account's own Stripe Customer; nothing is granted here, only the webhook grants (ADR-274, ADR-275).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutBody"
      responses:
        "201":
          description: The session our /checkout page mounts Stripe's fields on (ADR-274)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutStarted"
        "400":
          description: "`tick_required`: the box was not ticked (ADR-274); `bad_return`: `returnTo` is not on the list (reading 2); or a validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "`sign_in_required`: buying needs an account, on every host (reading 1)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "A plan only: `no_personal_report`, the reader has no finished Personal report of their own for Timeline to read; `already_subscribed`, they already have a live plan (ADR-277)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: "`checkout_unavailable`: Stripe isn't ready on this host, or on production the sale isn't ready (reading 8, MB-115)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /checkout/{purchaseId}:
    get:
      operationId: getCheckout
      tags: [checkout]
      summary: Where a purchase stands, for the page that waits for its credit
      description: The purchase's state, item and return, read by the done page until the webhook grants it; only its buyer reads it (ADR-274, ADR-275).
      parameters:
        - name: purchaseId
          in: path
          required: true
          schema:
            type: string
          description: The id POST /checkout answered (ADR-274).
      responses:
        "200":
          description: The purchase's state (ADR-275)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutState"
        "404":
          description: No purchase with this id is the signed-in reader's, so a stranger learns nothing (ADR-274)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /billing/portal:
    post:
      operationId: openBillingPortal
      tags: [checkout]
      summary: Open Stripe's Customer Portal to manage or cancel Timeline
      description: A Customer Portal session for the signed-in account's Stripe Customer, behind Manage payment and Cancel Timeline on the Account page (ADR-277).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenBillingPortalBody"
      responses:
        "200":
          description: The Portal's address, opened at once (ADR-277)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPortalOpened"
        "400":
          description: "`bad_return`: `returnTo` is not on the list (reading 2); or a validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "`sign_in_required`: the Portal belongs to an account (reading 1)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`no_customer`: the account has never paid, so Stripe has nothing of theirs to manage (reading 1)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: "`checkout_unavailable`: Stripe isn't ready on this host (reading 8)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites:
    get:
      operationId: listInvites
      tags: [invites]
      summary: List active invites for a profile owned by the current viewer
      description: |
        Returns all unclaimed, unexpired invite tokens for the given profile.
        The caller must own the profile (i.e. be the owner by userId or sessionId).
        Ownership is the effective gate — all active invites for the profile are
        returned regardless of which session originally created them.
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: string
          description: Filter invites to those belonging to this profile
      responses:
        "200":
          description: List of active invite records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InviteRecord"
        "403":
          description: Not the owner of the profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createInvite
      tags: [invites]
      summary: Create an invite token and send the claim email
      description: Generates a single-use signed token tied to a profile (and optional relationship) and emails it to the recipient.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteBody"
      responses:
        "201":
          description: Invite created and email queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteSummary"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the owner of the profile/relationship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Profile is already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /invites/{token}:
    get:
      operationId: getInvite
      tags: [invites]
      summary: Resolve an invite token to its preview metadata
      description: |
        Public endpoint used by the claim landing page to render the invite
        without requiring sign-in. A token that has already been claimed is
        still resolvable (so the landing page can show a "this invite was
        already accepted" state) and is signaled by `alreadyClaimed: true`
        in the response body. Tokens that do not exist or have expired
        return 404. A send's token lives 7 days and a gift's 30, expiry
        applied on read (ADR-123).
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite preview (may be already-claimed; check `alreadyClaimed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: Token not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/{token}/claim:
    post:
      operationId: claimInvite
      tags: [invites]
      summary: Claim an invite as the signed-in user
      description: >
        Requires Clerk authentication. A send marks the token claimed, sets
        profile.claimed_by_user_id, and adds the user as a participant on the
        related relationship. A gift moves its held credit into the claimer's
        balance and answers `redirectTo: /dashboard`; it puts no one on an
        orbit (ADR-139). A share writes a grant to read the sharer's own
        Personal report, never a hand-over, and answers `shareBack` (ADR-235).
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteClaimResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Token not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/{id}/change-address:
    post:
      operationId: changeInviteAddress
      tags: [invites]
      summary: Send a waiting send's link to a corrected address
      description: >
        Change address (ADR-237, MB-109), in one transaction: the old link is
        revoked and a new one is emailed to the new address, so the old link
        answers as revoked from then on.
      parameters:
        - name: id
          in: path
          required: true
          description: The invite's id, as GET /invites lists it, never its token.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeAddressBody"
      responses:
        "200":
          description: The send at its new address, with the new claim link and whether its email went (ADR-237)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteSummary"
        "400":
          description: Validation error, such as an unusable email (ADR-237)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No send of the viewer's with this id (ADR-237)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`not_waiting`: the send was claimed or has expired, so its address stays (ADR-237)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /gifts:
    get:
      operationId: listGifts
      tags: [gifts]
      summary: The viewer's gifts, waiting, claimed or returned
      description: What a giver sees of a gift, its state and nothing the recipient makes (ADR-139). Empty for anonymous users.
      responses:
        "200":
          description: The viewer's gifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gift"
    post:
      operationId: createGift
      tags: [gifts]
      summary: Gift a report
      description: Holds one of the giver's credits for 30 days and emails the cover with a claim link; the claim moves the credit into the recipient's balance (ADR-123, ADR-139). With no credit to hold it answers 402 and nothing is sent (ADR-275).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGiftBody"
      responses:
        "201":
          description: The gift, waiting, plus the claim link exactly as its email carried it and whether that email went (ADR-123).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: A gift needs an account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          $ref: "#/components/responses/NoCredit"
        "429":
          $ref: "#/components/responses/RateLimited"

  /gifts/{id}/remind:
    post:
      operationId: remindGift
      tags: [gifts]
      summary: Remind the recipient of a waiting gift
      description: Mints a fresh claim link for the same gift and emails it; the gift keeps its return date (ADR-123).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Reminder sent
        "404":
          description: No waiting gift of the viewer's with this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Reminded too recently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gifts/{id}/change-address:
    post:
      operationId: changeGiftAddress
      tags: [gifts]
      summary: Send a waiting gift's link to a corrected address
      description: >
        Change address (ADR-237, MB-109), in one transaction: the old link is
        revoked and a new one is emailed to the new address; the gift keeps
        its held credit and its return date.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeAddressBody"
      responses:
        "200":
          description: The gift at its new address, with the new claim link exactly as its email carried it and whether that email went (ADR-237)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftCreated"
        "400":
          description: Validation error, such as an unusable email (ADR-237)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No gift of the viewer's with this id (ADR-237)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`not_waiting`: the gift was claimed or returned, so its address stays (ADR-237)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /gifts/{id}:
    delete:
      operationId: takeBackGift
      tags: [gifts]
      summary: Take a waiting gift back
      description: Its claim link stops working and the held credit returns to the giver's balance (ADR-123).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Taken back
        "404":
          description: No gift of the viewer's with this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shares:
    get:
      operationId: listShares
      tags: [shares]
      summary: Who the viewer's own Personal report is shared with
      description: The list on the sharer's own quick look, each share waiting on its claim or read through its grant, each with Stop sharing (ADR-235). Empty for anonymous users.
      responses:
        "200":
          description: The viewer's shares, waiting and active (ADR-235)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Share"
    post:
      operationId: shareMyReport
      tags: [shares]
      summary: Share the viewer's own Personal report by email
      description: >
        Share my report (ADR-235, MB-104): a `share` invite on the
        send-and-claim path, its link living 7 days and counted with sends.
        Its claim writes a grant, never a hand-over, so the recipient reads the
        whole Personal report but never its workbook, and the sharer sits on
        their circle marked shared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareBody"
      responses:
        "201":
          description: The share, waiting, plus the claim link exactly as its email carried it and whether that email went (ADR-235)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareCreated"
        "400":
          description: Validation error, such as an unusable email (ADR-235)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sharing needs an account, since a grant joins two accounts (ADR-235)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            `no_own_report`: no Personal report is marked as the viewer's own;
            `not_ready`: it is not finished; `already_shared`: it is already
            shared with that address (ADR-235)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /shares/back:
    post:
      operationId: shareBack
      tags: [shares]
      summary: Share yours back with someone who shared theirs
      description: >
        Share yours back (ADR-235, MB-104), one tap and no email, since both
        people are known: the viewer's own finished Personal report is granted
        at once to whoever shared the given profile with them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareBackBody"
      responses:
        "201":
          description: The share, active at once (ADR-235)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          description: Validation error, such as no profileId (ADR-235)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No active share of this profile with the viewer (ADR-235)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Share yours back is not offered, as `shareBack` would be false; no finished Personal report of the viewer's own, or it is already shared with them (ADR-235)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shares/{id}:
    delete:
      operationId: stopShare
      tags: [shares]
      summary: Stop sharing the viewer's own Personal report with one person
      description: >
        The sharer's Stop sharing, at once (ADR-235): the grant or the waiting
        link is revoked, the sharer leaves the reader's circle, and a pair the
        reader built on that chart closes, naming the sharer.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The reader no longer reads it, or the waiting link no longer opens (ADR-235)
        "404":
          description: No share of the viewer's with this id (ADR-235)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /geocode:
    get:
      operationId: geocodePlace
      tags: [reports]
      summary: Geocode a place name to coordinates
      description: Converts a city/place name to latitude, longitude, and timezone
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            # MB-165 provisional: a one-letter search is refused at the door; the route stays for MB-30's move.
            minLength: 2
          description: >-
            Place name to geocode, at least two characters once trimmed, as the
            place field asks before it searches.
      responses:
        "200":
          description: Geocoded place candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeSearchResponse"
        "400":
          description: Validation error, such as a q shorter than two characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Place not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            `no_zone`: no place found has a time zone, so none is offered, and
            `message` is the line the page shows, "Pick a nearby town." (ADR-246, MB-30)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /timeline/access:
    get:
      operationId: getTimelineAccess
      tags: [timeline]
      summary: Whether the signed-in reader has Timeline (ADR-262)
      description: >
        The one access check's answer (ADR-262), for every signed-in reader:
        its sources are the signed-in admin and a live Timeline plan
        (ADR-277), whose item and dates `plan` carries. It says too whether
        the reader has a finished Personal report of their own, and with
        access Ask's use this month (ADR-263).
      responses:
        "200":
          description: The reader's access, its source, their plan and Ask's count this month (ADR-262, ADR-263, ADR-277)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineAccess"
        "401":
          description: "`sign_in_required`: no one is signed in, and Timeline belongs to an account (ADR-262)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timeline/now:
    get:
      operationId: getTimelineNow
      tags: [timeline]
      summary: Now and ahead, the sky on the reader's own chart from today (ADR-207)
      description: >
        A week, a month or six months from today in the reader's days (ADR-207):
        the natal points and angles the dial draws, each day's tones, every
        event in the range with its whole window and plain words, and what
        starts, peaks or eases next. Every date and degree is the engine's.
        The six-month range queues the readings of contacts entering it, at
        most three a call (ADR-210).
      parameters:
        - name: range
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TimelineRange"
          description: Seven days from today, thirty or 182 (ADR-207).
        - $ref: "#/components/parameters/ReaderZone"
      responses:
        "200":
          description: Now and ahead over the range (ADR-207)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineNow"
        "400":
          description: Validation error, a range that is not week, month or six-months (ADR-207)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/NoTimeline"
        "409":
          $ref: "#/components/responses/NoPersonalReport"
        "429":
          $ref: "#/components/responses/RateLimited"

  /timeline/life:
    get:
      operationId: getTimelineLife
      tags: [timeline]
      summary: Life, the reader's long cycles from birth to 90 (ADR-209)
      description: >
        From the reader's own chart (ADR-209): the four known ages first, then
        every life cycle with its plain words and exact passes, and each slow
        planet's wave. `age` and `birth` place today and each cycle on the waves.
      parameters:
        - $ref: "#/components/parameters/ReaderZone"
      responses:
        "200":
          description: Life from birth to 90 (ADR-209)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineLife"
        "403":
          $ref: "#/components/responses/NoTimeline"
        "409":
          $ref: "#/components/responses/NoPersonalReport"

  /timeline/readings/{key}:
    post:
      operationId: openTimelineReading
      tags: [timeline]
      summary: Open the reading of an event or a life cycle, written the first time (ADR-210)
      description: >
        A reading is written once per event per person, the first time it is
        opened, then kept with the reader's Personal report (ADR-210, MB-191).
        Ready answers it; writing says it is being written, so open it again
        soon; failed carries the line the sheet shows. A reading whose basis
        no longer matches the chart or the prompt is written again.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The key a TimelineEvent or a LifeCycleView carries, at most 80 characters (ADR-210).
      responses:
        "200":
          description: The reading, ready, writing or failed (ADR-210, MB-191)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenedReading"
        "403":
          $ref: "#/components/responses/NoTimeline"
        "404":
          description: No event or life cycle on the reader's own chart has this key, it gets no reading, or there is no chart to read (ADR-210)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Paused"

  /ask:
    # MB-191 provisional: the thread keeps 31 days, a person as who and which day, and goes with the Personal report.
    get:
      operationId: getAskThread
      tags: [ask]
      summary: The reader's Ask thread and what's left this month (ADR-213, ADR-263)
      description: >
        The thread from the last 31 days, oldest first; a person card is kept
        as who and which day and computed when shown, while the reader can
        still read them (ADR-213, MB-191). `usage` is always there (ADR-263).
        Ask reads the reader's own chart, so it answers 409 without a
        finished Personal report of their own, as Timeline does.
      parameters:
        - $ref: "#/components/parameters/ReaderZone"
      responses:
        "200":
          description: The thread and Ask's count this month (ADR-213, ADR-263, MB-191)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskThread"
        "403":
          $ref: "#/components/responses/NoTimeline"
        "409":
          $ref: "#/components/responses/NoPersonalReport"
    post:
      operationId: sendAskMessage
      tags: [ask]
      summary: Send Ask a message or a tapped choice (ADR-213)
      description: >
        Text or a tapped choice, never both, each one of the month's 50
        (ADR-263). From a report page it carries that report's id, read only
        if the reader can read it. Ask answers with text and the same computed
        cards as Timeline, quoting reports word for word, or asks back with
        choices (ADR-213). Answers the thread with both new messages and the
        count after them. Nothing the reader types reaches a log (ADR-201).
        Its days are the reader's, in the zone `tz` names (ADR-207).
      parameters:
        - $ref: "#/components/parameters/ReaderZone"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAskBody"
      responses:
        "200":
          description: The thread with the reader's message and Ask's answer, and the count after them (ADR-213, ADR-263)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskThread"
        "400":
          description: Validation error, such as neither or both of text and choiceId, text over 500 characters, or a choice Ask did not offer (ADR-213)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/NoTimeline"
        "409":
          $ref: "#/components/responses/NoPersonalReport"
        "429":
          description: >
            `rate_limited`: too many messages in a minute, Retry-After carrying
            the wait (ADR-199); or `ask_cap`: the month's 50 are used, with the
            day the count starts again (ADR-263).
          headers:
            Retry-After:
              description: Seconds until the limit lets the next message through, on `rate_limited` only.
              schema:
                type: integer
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RateLimited"
                  - $ref: "#/components/schemas/AskCap"
        "503":
          $ref: "#/components/responses/Paused"

components:
  parameters:
    AdminKey:
      name: x-admin-key
      in: header
      required: false
      schema:
        type: string
      description: Shared-secret admin key. May also be passed as `?key=`.
    ReaderZone:
      name: tz
      in: query
      required: false
      schema:
        type: string
      description: >-
        The reader's IANA time zone as their browser names it, the zone their
        days are read in; one the server cannot read falls back to the birth
        place's zone (ADR-207, ADR-211).

  # The origin guard's 403 (`forbidden_origin`) is on no route: it refuses only a
  # write from an Origin outside WEB_ORIGINS, and the client calls /api from the
  # site's own origin, so it never meets one (ADR-197).
  responses:
    SignInRequired:
      description: >
        Writing needs an account (ADR-140), so on production a request with no
        signed-in user is refused before any limit counts it. Staging keeps
        anonymous writes. `message` is the line the page shows.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SignInRequired"
    RateLimited:
      description: >
        Too many requests of this kind in the window its limit counts (ADR-199).
        `message` is the line the page shows; Retry-After and `retryAfterSeconds`
        carry the same wait.
      headers:
        Retry-After:
          description: Seconds until the limit lets the next request of this kind through.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimited"
    Paused:
      description: >
        Writing is paused: today's (UTC) generation spend has reached
        DAILY_SPEND_CAP_USD (ADR-199). `message` is the line the page shows.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Paused"
    NoTimeline:
      description: >
        `no_timeline`: the reader does not have Timeline. One access check
        answers it on every Timeline and Ask route (ADR-262); its sources are
        the signed-in admin and a live Timeline plan (ADR-277).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NoTimeline"
    NoPersonalReport:
      description: >
        `no_personal_report`: the reader has no finished Personal report of
        their own, and Timeline reads that report's chart (ADR-205, ADR-209).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NoCredit:
      description: >
        `no_credit`: the reader has no credit to take, so nothing was written
        or sent, on every host (ADR-275). `message` is the line the page shows,
        beside Get credits.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NoCredit"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        env:
          type: string
          enum: [development, staging, production]
          description: Which deployment answered. The smoke check asserts it so a web origin cannot silently route to the wrong API.
        commit:
          type: string
          description: Git sha of the running build, when the platform injects one.
        edge:
          type: boolean
          description: >-
            Whether this call carried the edge secret that only Vercel's edge
            adds, the one condition on which the API trusts the visitor's
            forwarded address (ADR-224). Yes or no only: the secret itself is
            never sent back.
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    RateLimited:
      type: object
      description: A rate limit's 429 body (ADR-199).
      properties:
        error:
          type: string
          enum: [rate_limited]
        message:
          type: string
          description: The one line the page shows, so its words live in the API.
        retryAfterSeconds:
          type: integer
          description: The wait Retry-After carries.
      required: [error, message, retryAfterSeconds]

    SignInRequired:
      type: object
      description: The 401 body of a writing route on production when no one is signed in (ADR-140).
      properties:
        error:
          type: string
          enum: [sign_in_required]
        message:
          type: string
          description: The one line the page shows, so its words live in the API.
      required: [error, message]

    Paused:
      type: object
      description: The 503 body while the daily spend cap pauses writing (ADR-199).
      properties:
        error:
          type: string
          enum: [paused]
        reason:
          type: string
          enum: [paused]
        message:
          type: string
          description: The one line the page shows, so its words live in the API.
      required: [error, reason, message]

    NoCredit:
      type: object
      description: The 402 body of a report or a gift asked for with no credit to take (ADR-275).
      properties:
        error:
          type: string
          enum: [no_credit]
        message:
          type: string
          description: The one line the page shows, so its words live in the API.
      required: [error, message]

    JoinWaitlistBody:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        consent:
          type: string
          enum: [launch-email-v1, launch-email-v2]
          description: The consent wording shown beside the form, stored with the address. launch-email-v2 is the double opt-in wording (ADR-145).
        source:
          type: string
          maxLength: 32
          description: Which form on the page sent it, such as hero or dawn.
        utmSource:
          type: string
          maxLength: 100
        utmMedium:
          type: string
          maxLength: 100
        utmCampaign:
          type: string
          maxLength: 100
        utmContent:
          type: string
          maxLength: 100
          description: The post that brought them, one tag per post (ADR-147), kept with the address under the retention rule (ADR-145).
        website:
          type: string
          maxLength: 200
          description: Hidden from people and left empty by them.
      required:
        - email
        - consent

    WaitlistJoined:
      type: object
      properties:
        status:
          type: string
          enum: [joined, check_email]
          description: check_email answers every join under double opt-in, whatever the address's standing (ADR-145); joined is the answer from before it.
      required:
        - status

    ConfirmWaitlistBody:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
          description: The token from the emailed link; only its SHA-256 is stored (ADR-145).
      required:
        - token

    WaitlistConfirmed:
      type: object
      description: The address stays on the list until the opening email or a request to delete it (ADR-145).
      properties:
        status:
          type: string
          enum: [confirmed]
      required:
        - status

    CreateReportBody:
      type: object
      properties:
        name:
          type: string
          # MB-157 provisional: ・, the ideographic space and ZWNJ, so Japanese and Persian names go in as written.
          pattern: '^(?=.*\p{L})(?![ \u3000])(?!.*[ \u3000]$)[\p{L}\p{M} \u3000''’.·・\u200C-]{1,60}$'
          description: >-
            The person's name, 1 to 60 characters: letters, marks, spaces (the
            ideographic space too), apostrophes (' ’), hyphens, dots (. · ・)
            and the zero-width non-joiner some scripts spell names with; at
            least one letter, and no space at either end. So what reaches the
            prompt is a name and never markup or an instruction (ADR-202).
        birthDate:
          type: string
          description: Birth date in YYYY-MM-DD format
        birthTime:
          type: string
          description: Birth time in HH:MM format (24h)
        birthPlace:
          type: string
          description: Birth place name (e.g. "Milan, Italy")
        latitude:
          type: number
          description: Latitude of birth place
        longitude:
          type: number
          description: Longitude of birth place
        timezoneOffset:
          type: number
          description: UTC offset in hours (e.g. 1 for CET). Used only when no `timezone` is given.
        timezone:
          type: string
          description: IANA zone name of the birth place. The offset in force at the birth instant derives from it (MB-48).
        birthTimeWindowMinutes:
          type: integer
          description: Half-width of the birth-time band around `birthTime`. 0 exact, 180 a part of the day, 720 unknown (ADR-33). Default 0.
        isForSelf:
          type: boolean
          description: >
            When true, the profile created (or resolved) for this report is
            explicitly flagged as the submitter's own self-profile. The server
            sets `isSelf=true` on the profile row. Only one self-profile per
            user is intended; this should only be sent from the "Generate My
            Chart" flow, not the "Add a Person" flow.
      required:
        - name
        - birthDate
        - birthTime
        - birthPlace
        - latitude
        - longitude
        - timezoneOffset

    Access:
      description: "The viewer's standing on a report: owner made it, claimed is its subject holding a sent report, participant was sent a pair (ADR-139; pairs ADR-236), shared reads its subject's own Personal report through their grant (ADR-235)."
      type: string
      enum: [owner, claimed, participant, shared]

    SendState:
      description: Where Send to {firstName} stands, on a finished natal report about someone else or a pair the viewer is one of (ADR-120, ADR-133, ADR-139).
      type: object
      properties:
        state:
          type: string
          enum: [can_send, can_grant, sent, joined, handed_back]
          description: can_send asks for an email; can_grant gives a pair at once to someone already on Stars Decoded (MB-82); sent waits on the claim; joined means they have it, "Joined ✓"; handed_back means they handed it back with Not me, and Send again is a new send (ADR-236).
        profileId:
          type: string
          description: The person it goes to, the report's subject or the pair's other person.
        relationshipId:
          type: string
          nullable: true
          description: The pair's relationship; null on a natal report.
        firstName:
          type: string
          description: The name the control prints, "Send to {firstName}".
      required: [state, profileId, relationshipId, firstName]

    ReportSummary:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [natal, compatibility]
          description: Natal rows describe a single profile; compatibility rows describe a relationship between two profiles.
        name:
          type: string
          description: Display name. For natal, the profile's name. For compatibility, "{A} & {B}".
        birthDate:
          type: string
          description: Only set for natal reports.
        birthTime:
          type: string
          description: Only set for natal reports.
        birthPlace:
          type: string
          description: Only set for natal reports.
        status:
          type: string
          enum: [pending, computing, interpreting, revising, complete, failed]
        horizon:
          type: string
          enum: [known, approximate, unknown]
          nullable: true
          description: The natal chart's horizon status, so a blind report's tile can carry the call to action.
        archetypeName:
          description: The report's overview headline (kept under its historical name for client compatibility). Null until the report completes.
          type: string
          nullable: true
        sunSign:
          type: string
          nullable: true
        moonSign:
          type: string
          nullable: true
        risingSign:
          type: string
          nullable: true
        profileId:
          type: string
          nullable: true
          description: Profile ID for natal reports. Null for compatibility reports.
        relationshipId:
          type: string
          nullable: true
          description: Set for compatibility reports.
        relationshipType:
          type: string
          nullable: true
          description: The lens (partners, parent_child, people). Set for compatibility reports.
        lens:
          $ref: "#/components/schemas/RelationshipType"
          nullable: true
        participants:
          type: array
          description: Participant summaries. Set for compatibility reports.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              sunSign:
                type: string
                nullable: true
              moonSign:
                type: string
                nullable: true
              risingSign:
                type: string
                nullable: true
            required:
              - id
              - name
        createdAt:
          type: string
        failureReason:
          $ref: "#/components/schemas/FailureReason"
          nullable: true
        access:
          $ref: "#/components/schemas/Access"
          description: The viewer's standing on this report (ADR-139).
        send:
          description: Send to {name} on this row; null where it is not offered (ADR-120, ADR-133).
          anyOf:
            - $ref: "#/components/schemas/SendState"
            - type: "null"
        sharedBy:
          type: string
          nullable: true
          description: First name of whoever sent this report to the viewer; null when the viewer made it (ADR-139).
        stoppedBy:
          type: string
          nullable: true
          description: On a closed pair, the first name of whoever stopped sharing a natal report it came from; null while it reads (ADR-236).
      required:
        - id
        - kind
        - name
        - status
        - createdAt

    FailureReason:
      type: object
      description: Why a failed report failed, as the customer reads it. Null unless the status is failed.
      properties:
        code:
          type: string
          enum: [provider_unreachable, provider_out_of_credit, quality, internal]
        line:
          type: string
          description: The plain line the customer reads.
      required: [code, line]

    ReportStatus:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, computing, interpreting, revising, complete, failed]
        errorMessage:
          type: string
          nullable: true
          description: Always null; internal text never reaches a customer response. Kept so older clients build.
        failureReason:
          $ref: "#/components/schemas/FailureReason"
          nullable: true
        canRegenerate:
          type: boolean
          description: The viewer may run Try again or Regenerate here, its writer or its holder after a hand-over, never a shared reader (MB-169). Try again is free; a final report, its credit back after its third failure, has none, so this is false (ADR-313). Sent as on Report, so the page offers a rewrite from whichever of the two reads it fetched last.
        outdated:
          type: boolean
          description: A complete natal report written for another birth time or horizon than its profile's now, which Regenerate rewrites free (MB-170). Sent as on Report.
        chartReady:
          description: The chart is stored, so the report page can open on the hero and the explorer.
          type: boolean
        provisional:
          description: >
            While the chart is not yet stored: every body's position on the
            entered date and time at offset zero, from one local call, so the
            orrery can run from the birth day (ADR-47). Null once the chart
            exists, or when the profile is gone.
          type: object
          nullable: true
          properties:
            bodies:
              type: object
              additionalProperties:
                type: object
                properties:
                  absoluteDegree:
                    type: number
                  retrograde:
                    type: boolean
                required: [absoluteDegree, retrograde]
          required: [bodies]
        sections:
          description: One entry per section of the report's type, "done" once that section is stored.
          type: object
          additionalProperties:
            type: string
            enum: [pending, done]
        interpretation:
          description: The interpretation so far. Sections appear as each call lands.
          $ref: "#/components/schemas/ReportInterpretation"
          nullable: true
      required:
        - id
        - status
        - chartReady
        - sections

    PlanetPosition:
      type: object
      properties:
        sign:
          type: string
        degree:
          type: number
        absoluteDegree:
          type: number
        house:
          type: integer
          description: Whole-sign house. Absent when the horizon is unknown.
        retrograde:
          type: boolean
        speed:
          type: number
        band:
          description: Sun and Moon only, when the birth time is a band. Absolute degrees at the band's two ends.
          type: object
          properties:
            fromDegree:
              type: number
            toDegree:
              type: number
          required: [fromDegree, toDegree]
      required:
        - sign
        - degree
        - absoluteDegree
        - retrograde
        - speed

    HorizonFact:
      description: One fact the birth hour decides, swept across the band at two-minute steps.
      type: object
      properties:
        value:
          type: string
          description: The value at the centre time.
        holds:
          type: boolean
          description: True when the value never changed across the band.
        flipsAt:
          type: array
          description: Local times (HH:MM) inside the band at which the value changed.
          items:
            type: string
        values:
          type: array
          description: The sequence of values across the band.
          items:
            type: string
        holdsFrom:
          type: string
          description: Where the centre value's run within the birth day begins (HH:MM).
        holdsTo:
          type: string
          description: Where it ends (HH:MM, or 24:00).
      required: [value, holds, flipsAt, values, holdsFrom, holdsTo]

    Horizon:
      description: The horizon as a status, never a guess (ADR-33).
      type: object
      properties:
        status:
          type: string
          enum: [known, approximate, unknown]
        ascendant:
          $ref: "#/components/schemas/HorizonFact"
        midheaven:
          $ref: "#/components/schemas/HorizonFact"
        sect:
          $ref: "#/components/schemas/HorizonFact"
        moonSign:
          $ref: "#/components/schemas/HorizonFact"
        sunSign:
          $ref: "#/components/schemas/HorizonFact"
      required: [status, ascendant, midheaven, sect, moonSign, sunSign]

    HorizonPreviewBody:
      type: object
      properties:
        birthDate:
          type: string
        birthTime:
          type: string
          description: The band's centre, HH:MM.
        birthTimeWindowMinutes:
          type: integer
        latitude:
          type: number
        longitude:
          type: number
        timezone:
          type: string
          description: IANA zone name. Preferred over `timezoneOffset`.
        timezoneOffset:
          type: number
      required: [birthDate, birthTime, birthTimeWindowMinutes, latitude, longitude]

    UpdateBirthTimeBody:
      type: object
      properties:
        birthTime:
          type: string
        birthTimeWindowMinutes:
          type: integer
      required: [birthTime, birthTimeWindowMinutes]

    BirthTimeUpdateResponse:
      type: object
      properties:
        profileId:
          type: string
        horizon:
          type: string
          enum: [known, approximate, unknown]
        reportIds:
          type: array
          description: "The report a pass has started on: the profile's newest complete Personal report, or none when it has none, the time draws no horizon, or the report is written for this time already (MB-170)."
          items:
            type: string
      required: [profileId, horizon, reportIds]

    Angle:
      type: object
      properties:
        sign:
          type: string
        degree:
          type: number
        absoluteDegree:
          type: number
      required:
        - sign
        - degree
        - absoluteDegree

    Aspect:
      type: object
      properties:
        planet1:
          type: string
        planet2:
          type: string
        type:
          type: string
        orb:
          type: number
        applying:
          type: boolean
      required:
        - planet1
        - planet2
        - type
        - orb
        - applying

    ChartData:
      type: object
      properties:
        datetimeUtc:
          type: string
        julianDay:
          type: number
        latitude:
          type: number
        longitude:
          type: number
        timezoneOffset:
          type: number
        timezone:
          type: string
        windowMinutes:
          type: integer
          description: Half-width of the birth-time band. 0 for an exact time.
        horizon:
          $ref: "#/components/schemas/Horizon"
        sunAltitude:
          type: number
          description: True altitude of the Sun's centre at birth. Absent when the horizon is unknown.
        planets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PlanetPosition"
        angles:
          description: Absent when the horizon is unknown.
          type: object
          properties:
            ascendant:
              $ref: "#/components/schemas/Angle"
            midheaven:
              $ref: "#/components/schemas/Angle"
            descendant:
              $ref: "#/components/schemas/Angle"
            ic:
              $ref: "#/components/schemas/Angle"
          required:
            - ascendant
            - midheaven
            - descendant
            - ic
        houses:
          description: Absent when the horizon is unknown.
          type: object
          additionalProperties:
            type: object
            properties:
              sign:
                type: string
              degree:
                type: number
            required:
              - sign
              - degree
        aspects:
          type: array
          items:
            $ref: "#/components/schemas/Aspect"
        elements:
          type: object
          properties:
            fire:
              type: integer
            earth:
              type: integer
            air:
              type: integer
            water:
              type: integer
          required:
            - fire
            - earth
            - air
            - water
        modalities:
          type: object
          properties:
            cardinal:
              type: integer
            fixed:
              type: integer
            mutable:
              type: integer
          required:
            - cardinal
            - fixed
            - mutable
        dominance:
          type: object
          properties:
            dominantPlanets:
              type: array
              items:
                type: string
            dominantElement:
              type: string
            dominantModality:
              type: string
          required:
            - dominantPlanets
            - dominantElement
            - dominantModality
        chartShape:
          type: string
          nullable: true
        hemisphereEmphasis:
          type: object
          properties:
            northern:
              type: integer
            southern:
              type: integer
            eastern:
              type: integer
            western:
              type: integer
          required:
            - northern
            - southern
            - eastern
            - western
      required:
        - datetimeUtc
        - julianDay
        - latitude
        - longitude
        - timezoneOffset
        - horizon
        - planets
        - aspects
        - elements
        - modalities
        - dominance

    EvidenceRef:
      description: >
        A structured reference to the chart, verified by the API before storage.
        Fields vary by kind. `cross` and `source` belong to the compatibility
        report: a cross-chart aspect or overlay, and a claim in one of the two
        natal reports (ADR-44).
      type: object
      properties:
        kind:
          type: string
          enum: [placement, aspect, ruler, lot, sect, angle, cross, source]
      required: [kind]
      additionalProperties: true

    StoredEvidence:
      type: object
      properties:
        ref:
          $ref: "#/components/schemas/EvidenceRef"
        label:
          description: Composed by the API from the verified reference; never model text.
          type: string
      required: [ref, label]

    Claim:
      description: A verbatim quote from the section's prose and the chart facts it rests on.
      type: object
      properties:
        quote:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/StoredEvidence"
      required: [quote, evidence]

    ActionItem:
      type: object
      properties:
        action:
          type: string
        why:
          type: string
      required: [action, why]

    ListedItem:
      description: A named item and the concrete reason this chart fits it.
      type: object
      properties:
        item:
          type: string
        reason:
          type: string
      required: [item, reason]

    HouseReading:
      description: One generated house-card reading, 40 to 70 words, ending on a behaviour check.
      type: object
      properties:
        house:
          type: integer
        reading:
          type: string
      required: [house, reading]

    Workbook:
      description: The reader's ticked items on a report, keyed by item, valued by the ISO date of the tick. A pin sits beside the ticks under "pin." and its item key, valued by the ISO date it was pinned (ADR-174).
      type: object
      additionalProperties:
        type: string

    WorkbookPatch:
      description: >
        A shallow merge onto the viewer's own workbook on the report
        (ADR-239). A string value is the ISO date the reader ticked the item,
        null unticks it. A key is a section id,
        a dot path and an index, for example "career.actions.0". Each segment
        before the index starts with a letter and may carry digits after it,
        as a pair chapter's id does in "partners02.nextTime.items.0" (ADR-24).
        A pin key is "pin." and an item key, "pin.focus.practice.bullets.0",
        valued by the ISO date of the pin and cleared by null; at most three
        pins stand in a reader's workbook, and a patch that would leave a fourth
        answers 400 pin_limit (ADR-174, ADR-239).
      type: object
      minProperties: 1
      maxProperties: 200
      propertyNames:
        description: An item key, or "pin." and an item key (ADR-24, ADR-174).
        pattern: '^(pin\.)?[a-z][a-zA-Z0-9]*(\.[a-zA-Z][a-zA-Z0-9]*)+\.\d+$'
      additionalProperties:
        type: string
        nullable: true

    Home:
      description: The dashboard's one read, everything its circle, quick looks, rows, pairs, stories and practice show (ADR-174).
      type: object
      properties:
        you:
          description: The reader's own Personal report at the circle's centre, with chapter 08's lines; null with none marked as theirs, or several (ADR-174).
          anyOf:
            - $ref: "#/components/schemas/HomePerson"
            - type: "null"
        several:
          type: boolean
          description: More than one chart is marked as the reader's own, so `you` stays null until they settle which (ADR-120, ADR-174).
        people:
          type: array
          description: >
            The circle and the People list, the same people: every profile with a Personal report
            the reader can read, written until its subject stops sharing or sent to them, and each
            sharer whose own Personal report they read through a grant, seated as `shared` until
            that sharer stops sharing; each with its latest readable report (ADR-182, ADR-235).
          items:
            $ref: "#/components/schemas/HomePerson"
        pairs:
          type: array
          description: The Compatibility reports GET /reports lists for the reader, for Your pairs and their stories; a closed one carries stoppedBy (ADR-174, ADR-236).
          items:
            $ref: "#/components/schemas/HomePair"
        practising:
          type: array
          description: >
            What the reader is practising: up to three pins a report from their own Personal report
            and the pairs they are one of; none pinned, the Closing's first Practice item (ADR-174).
          items:
            $ref: "#/components/schemas/HomePractice"
        week:
          description: Your week, for a reader with Timeline and a chart to read; absent or null for anyone else (ADR-211, ADR-262).
          anyOf:
            - $ref: "#/components/schemas/Week"
            - type: "null"
        teaser:
          description: >
            Your life's big cycles, last on the dashboard, for a reader without Timeline whose own
            Personal report is finished, never on an empty dashboard; absent or null for anyone else
            (ADR-212, ADR-255, ADR-262).
          anyOf:
            - $ref: "#/components/schemas/Teaser"
            - type: "null"
      required: [you, several, people, pairs, practising]

    HomePerson:
      description: One person in the reader's circle, with what their quick look and row show, read from the stored chart and report (ADR-174, ADR-182).
      type: object
      properties:
        profileId:
          type: string
        reportId:
          type: string
          description: Their latest Personal report the reader can read (ADR-182).
        name:
          type: string
        birthDate:
          type: string
          description: YYYY-MM-DD, as entered (ADR-174).
        status:
          type: string
          enum: [pending, computing, interpreting, revising, complete, failed]
        access:
          type: string
          enum: [owner, claimed, shared]
          description: "The reader's standing on the report: owner made it, claimed is its subject holding a sent report (ADR-139), shared is its subject's own Personal report read through their grant, the sharer's seat (ADR-235)."
        isSelf:
          type: boolean
          description: The reader's own chart from their side, as ProfileSummary marks it (ADR-120).
        shareBack:
          type: boolean
          description: On a sharer's seat, Share yours back is offered, since the reader has a finished Personal report of their own not yet shared with them (ADR-235, MB-104).
        canRegenerate:
          type: boolean
          description: The reader may run Try again or Regenerate on this report, its writer or its holder after a hand-over, never a shared reader (MB-169). Try again is free; a final report, its credit back after its third failure, has none, so this is false (ADR-313).
        triad:
          type: object
          nullable: true
          description: Sun, Moon and Rising with degrees, from the stored chart; null until the chart is stored (ADR-174).
          properties:
            sun:
              $ref: "#/components/schemas/Spot"
            moon:
              $ref: "#/components/schemas/Spot"
            rising:
              description: Null when the horizon is unknown (ADR-174).
              anyOf:
                - $ref: "#/components/schemas/Spot"
                - type: "null"
          required: [sun, moon, rising]
        lines:
          type: object
          nullable: true
          description: >
            Chapter 08's superpower and growing edge, each its title and first sentence, on `you`
            only; null elsewhere and until chapter 08 is written (ADR-174).
          properties:
            superpower:
              type: string
            growingEdge:
              type: string
          required: [superpower, growingEdge]
      required: [profileId, reportId, name, birthDate, status, access, isSelf, triad, lines]

    Spot:
      description: Where the Sun, the Moon or the Rising stands, its sign and its degree within it (ADR-174).
      type: object
      properties:
        sign:
          type: string
        degree:
          type: number
          description: Degrees within the sign, rounded to two decimals (ADR-174).
        house:
          type: integer
          nullable: true
          minimum: 1
          maximum: 12
          description: The whole-sign house it stands in, as the quick look prints it ("4th (home)"); null without a birth time, and for the Rising (ADR-174).
        band:
          type: object
          nullable: true
          description: The Moon's range across a windowed birth time, read from the stored chart's band; absent or null on the Sun, the Rising and an exact time (MB-139).
          properties:
            from:
              $ref: "#/components/schemas/SpotPoint"
            to:
              $ref: "#/components/schemas/SpotPoint"
          required: [from, to]
      required: [sign, degree, house]

    SpotPoint:
      description: One end of the Moon's range, its sign and its degree within it (MB-139).
      type: object
      properties:
        sign:
          type: string
        degree:
          type: number
          description: Degrees within the sign, rounded to two decimals as a Spot's are (ADR-174, MB-139).
      required: [sign, degree]

    HomePair:
      description: One Compatibility report on the reader's list, with what its pair block and story show (ADR-174, ADR-175).
      type: object
      properties:
        reportId:
          type: string
        lens:
          $ref: "#/components/schemas/RelationshipType"
        label:
          type: string
          nullable: true
          description: The relationship's label; under the people lens, family, friends or colleagues (ADR-40, ADR-68).
        a:
          type: object
          description: The report's person A (ADR-174).
          properties:
            profileId:
              type: string
            name:
              type: string
          required: [profileId, name]
        b:
          type: object
          description: The report's person B (ADR-174).
          properties:
            profileId:
              type: string
            name:
              type: string
          required: [profileId, name]
        status:
          type: string
          enum: [pending, computing, interpreting, revising, complete, failed]
        stoppedBy:
          type: string
          nullable: true
          description: On a closed pair, the first name of whoever stopped sharing a natal report it came from; null while it reads (ADR-236).
        strong:
          type: array
          description: What comes naturally to the pair, chapter 01's strong lines; empty until chapter 01 is written (ADR-174).
          items:
            type: string
        challenge:
          type: string
          nullable: true
          description: The one challenge to work on; null until the report has it (ADR-174).
        story:
          type: object
          nullable: true
          description: The 9:16 story's text, chapter 01's headline and strengths; null until chapter 01 is written (ADR-174, ADR-175).
          properties:
            headline:
              type: string
            strengths:
              type: array
              items:
                type: string
          required: [headline, strengths]
      required: [reportId, lens, label, a, b, status, stoppedBy, strong, challenge, story]

    HomePractice:
      description: >
        One thing the reader is practising, an item pinned on their own Personal report or on a
        pair they are one of, or their Closing's first Practice item with none pinned; pins and
        ticks sit in the reader's own workbook on that report, which no other reader sees (ADR-174,
        ADR-239).
      type: object
      properties:
        reportId:
          type: string
        kind:
          type: string
          enum: [natal, compatibility]
        key:
          type: string
          description: The item key the report ticks it under, "focus.practice.bullets.0" or "partners02.nextTime.items.0" (ADR-24).
        action:
          type: string
        why:
          type: string
          nullable: true
        pinned:
          type: boolean
          description: False on the Closing's first Practice item, offered with none pinned (ADR-174).
        ticked:
          type: boolean
          description: Ticked in the same workbook; a tick is silent and a box unticks (ADR-24, ADR-48).
      required: [reportId, kind, key, action, why, pinned, ticked]

    ReportTriadPart:
      type: object
      properties:
        label:
          type: string
        text:
          type: string
      required: [label, text]

    ReportSuperpowerItem:
      type: object
      properties:
        title:
          type: string
        text:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionItem"
      required: [title, text, actions]

    ReportFocusGroup:
      type: object
      properties:
        intro:
          type: string
        bullets:
          type: array
          items:
            type: object
            properties:
              point:
                type: string
              why:
                type: string
            required: [point, why]
      required: [intro, bullets]

    UsageTotals:
      description: Token counts and time, summed over one section's attempts or a whole report.
      type: object
      properties:
        attempts:
          description: Calls made. Above one when a reply was rejected and retried.
          type: number
        inputTokens:
          type: number
        cachedInputTokens:
          type: number
        outputTokens:
          type: number
        reasoningTokens:
          type: number
        ms:
          type: number
      required: [attempts, inputTokens, cachedInputTokens, outputTokens, reasoningTokens, ms]

    PairCard:
      description: "The side-by-side card of a lens chapter: three lines a side in that person's own words, one for the pair (ADR-63)."
      type: object
      properties:
        a:
          type: array
          items:
            type: string
        b:
          type: array
          items:
            type: string
        pair:
          type: string
      required: [a, b, pair]

    PairNextTimeItem:
      type: object
      properties:
        for:
          type: string
          enum: [A, B, both]
        action:
          type: string
        why:
          type: string
      required: [for, action, why]

    PairLensChapter:
      description: "Chapters 02 to 06 under every lens: the workbook chapter (ADR-63, ADR-64)."
      type: object
      properties:
        headline:
          type: string
        card:
          $ref: "#/components/schemas/PairCard"
        scene:
          type: string
        whatJustHappened:
          type: object
          properties:
            becauseA:
              type: string
            becauseB:
              type: string
          required: [becauseA, becauseB]
        pattern:
          type: string
        nextTime:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PairNextTimeItem"
          required: [items]
        claims:
          type: array
          items:
            $ref: "#/components/schemas/Claim"
      required: [headline, card, scene, whatJustHappened, pattern, nextTime, claims]

    PairTwoCharts:
      description: Chapter 01, Your two charts, the introduction under the wheel (ADR-63).
      type: object
      properties:
        headline:
          type: string
        strong:
          type: array
          items:
            type: string
        work:
          type: array
          items:
            type: string
        paradox:
          type: string
        strengths:
          type: array
          items:
            type: string
        pointer:
          type: string
          description: Stored by p2 reports; p3 writes none and the page prints none (ADR-176).
        claims:
          type: array
          items:
            $ref: "#/components/schemas/Claim"
      required: [headline, strong, work, paradox, strengths, claims]

    PairChapterScenes:
      description: "A lens chapter's scene. Since p3 titles holds the one fixed scene and written is 0; a p2 report stored three titles and wrote one, and any text written on tap stays stored, unread (ADR-65, ADR-176)."
      type: object
      properties:
        titles:
          type: array
          items:
            type: string
        written:
          type: integer
        texts:
          type: object
          additionalProperties:
            type: string
      required: [titles, written, texts]

    PairChecklist:
      type: object
      properties:
        intro:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActionItem"
      required: [intro, items]

    PairPractise:
      description: Chapter 07 of the compatibility report, three checklists collected from the lens chapters and a closing paragraph.
      type: object
      properties:
        opening:
          type: string
        forA:
          $ref: "#/components/schemas/PairChecklist"
        forB:
          $ref: "#/components/schemas/PairChecklist"
        forBoth:
          $ref: "#/components/schemas/PairChecklist"
        closing:
          type: string
        claims:
          type: array
          items:
            $ref: "#/components/schemas/Claim"
      required: [opening, forA, forB, forBoth, closing, claims]

    PairLink:
      description: One generated link card, 40 to 70 words, ending on a behaviour check (ADR-43).
      type: object
      properties:
        kind:
          type: string
          enum: [flows, rubs, overlay]
        planetA:
          type: string
        planetB:
          type: string
        aspect:
          type: string
        orb:
          type: number
        planet:
          type: string
          description: Overlay cards, the body that sits in the other chart's house.
        of:
          type: string
          enum: [A, B, none]
          description: An overlay's owner, A or B; an aspect card stores none, as the pair's link schema asks of the model (B-15).
        house:
          type: integer
        reading:
          type: string
      required: [kind, reading]

    PairLinks:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/PairLink"
      required: [links]

    SectionRevisionMark:
      description: One sentence a horizon pass changed, with what it said before and the evidence for the change.
      type: object
      properties:
        before:
          type: string
        now:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/StoredEvidence"
      required: [before, now, evidence]

    SectionAddition:
      type: object
      properties:
        text:
          type: string
        claims:
          type: array
          items:
            $ref: "#/components/schemas/Claim"
      required: [text, claims]

    HorizonPass:
      description: What the last horizon pass changed. Counts are the report's own; the page never recounts them (ADR-35).
      type: object
      properties:
        at:
          type: string
        passes:
          type: integer
        sentencesRevised:
          type: integer
        paragraphsAdded:
          type: integer
        sections:
          type: object
          additionalProperties:
            type: object
            properties:
              amended:
                type: array
                items:
                  $ref: "#/components/schemas/SectionRevisionMark"
              added:
                type: array
                items:
                  $ref: "#/components/schemas/SectionAddition"
            required: [amended, added]
      required: [at, passes, sentencesRevised, paragraphsAdded, sections]

    ReportInterpretation:
      description: >
        A report. Every section is schema-enforced at generation time, so a
        section that is present is complete. Only `meta` is required, because
        the report is readable while it writes and sections arrive one at a
        time. A natal report carries the natal sections; a compatibility report
        the pair sections (`meta.reportType`). A natal report whose horizon is
        unknown has no `houses`, no `triad.rising` and no `angleMeanings`.
      type: object
      properties:
        meta:
          type: object
          properties:
            promptVersion:
              type: string
            reportType:
              type: string
              enum: [natal, compatibility]
            lens:
              $ref: "#/components/schemas/RelationshipType"
            label:
              type: string
              nullable: true
              description: How two people know each other, in their words; null under the other lenses.
            band:
              type: string
              nullable: true
              enum: [little, school, teen, grown]
              description: The child's age band under the parent lens, derived from the birth date at generation (ADR-67); null otherwise.
            horizon:
              type: string
              enum: [known, approximate, unknown]
              description: Mirrors the chart's horizon status (ADR-34).
            horizonPass:
              $ref: "#/components/schemas/HorizonPass"
            model:
              description: >
                The model every call used, or "mixed" when the foundation and
                the sections differ. See usage.sections[].model for each one.
              type: string
            houseSystem:
              type: string
              enum: [whole-sign]
            generatedAt:
              type: string
            wordCount:
              type: number
            zodiac:
              type: string
            ephemeris:
              type: string
            orbs:
              type: object
              additionalProperties:
                type: number
            sect:
              type: string
              enum: [day, night]
              description: Absent when the horizon is unknown, as are sectLight, sunAltitude and sectMarginal.
            sectLight:
              type: string
              enum: [sun, moon]
            sunAltitude:
              type: number
            sectMarginal:
              type: boolean
            usage:
              description: >
                Tokens, cost and time for the eleven generation calls.
                Optional: reports generated before R02 have no usage block.
                `inputTokens` excludes `cachedInputTokens`, and
                `reasoningTokens` is a subset of `outputTokens`, never added
                on top of it.
              type: object
              properties:
                model:
                  description: The model every call used, or "mixed" when they differ.
                  type: string
                costUsd:
                  description: >
                    Priced per section on its own model and summed, when
                    generated. Null if any model has no price on record.
                  type: number
                  nullable: true
                wallClockMs:
                  description: End to end. Below `totals.ms`, because ten sections run at once.
                  type: number
                totals:
                  $ref: "#/components/schemas/UsageTotals"
                sections:
                  type: array
                  items:
                    allOf:
                      - $ref: "#/components/schemas/UsageTotals"
                      - type: object
                        properties:
                          section:
                            description: Prompt key, e.g. "natal:overview".
                            type: string
                          model:
                            description: The model this section's calls ran on.
                            type: string
                        required: [section, model]
              required: [model, costUsd, wallClockMs, totals, sections]
          required: [promptVersion, model, houseSystem, generatedAt, wordCount, zodiac, ephemeris, orbs]
        overview:
          type: object
          properties:
            headline:
              type: string
            concentration:
              type: string
            temperament:
              type: string
            distinctive:
              type: string
            bridge:
              type: string
            claims:
              type: array
              items:
                $ref: "#/components/schemas/Claim"
          required: [headline, concentration, temperament, distinctive, bridge, claims]
        triad:
          type: object
          properties:
            sun:
              $ref: "#/components/schemas/ReportTriadPart"
            moon:
              $ref: "#/components/schemas/ReportTriadPart"
            rising:
              $ref: "#/components/schemas/ReportTriadPart"
            claims:
              type: array
              items:
                $ref: "#/components/schemas/Claim"
          required: [sun, moon, claims]
        houses:
          description: The twelve house-card readings in order. They carry no claims, because the card is its own evidence.
          type: object
          properties:
            houses:
              type: array
              items:
                $ref: "#/components/schemas/HouseReading"
          required: [houses]
        mind:
          type: object
          properties:
            howYouThink:
              type: string
            howYouDecide:
              type: string
            howYouAreUnderstood:
              type: string
            practice:
              type: string
            claims:
              type: array
              items:
                $ref: "#/components/schemas/Claim"
          required: [howYouThink, howYouDecide, howYouAreUnderstood, practice, claims]
        career:
          type: object
          properties:
            vocationalPull:
              type: string
            howYouShowUp:
              type: string
            growthThroughWork:
              type: string
            actions:
              type: array
              items:
                $ref: "#/components/schemas/ActionItem"
            careerPaths:
