          type: string
        birthTime:
          type: string
        birthPlace:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        timezoneOffset:
          type: number
        timezone:
          type: string
          nullable: true
        birthTimeWindowMinutes:
          type: integer
        profileId:
          type: string
          nullable: true
          description: The profile a natal report reads; the birth time pass is addressed to it. Null on a compatibility report.
        type:
          type: string
          enum: [natal, compatibility]
        lens:
          $ref: "#/components/schemas/RelationshipType"
          nullable: true
        participants:
          description: The two people of a compatibility report. Null on a natal report.
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ReportParticipant"
        horizonPasses:
          type: integer
        revisions:
          description: The passes run on this report, newest last. The previous text is kept.
          type: array
          items:
            $ref: "#/components/schemas/ReportRevisionSummary"
        status:
          type: string
          enum: [pending, computing, interpreting, revising, complete, failed]
        chartData:
          $ref: "#/components/schemas/ChartData"
          nullable: true
        interpretation:
          $ref: "#/components/schemas/ReportInterpretation"
          nullable: true
        workbook:
          $ref: "#/components/schemas/Workbook"
        errorMessage:
          type: string
          nullable: true
          description: Always null; internal text never reaches a customer response. Kept so older clients build.
        failureReason:
          $ref: "#/components/schemas/FailureReason"
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
        access:
          $ref: "#/components/schemas/Access"
          description: The viewer's standing on this report (ADR-139).
        send:
          description: Send to {name} on this report; null where it is not offered (ADR-120, ADR-133).
          anyOf:
            - $ref: "#/components/schemas/SendState"
            - type: "null"
        giverName:
          type: string
          nullable: true
          description: First name of whoever sent this report to the viewer; null when the viewer made it (ADR-139).
      required:
        - id
        - name
        - birthDate
        - birthTime
        - birthPlace
        - latitude
        - longitude
        - timezoneOffset
        - birthTimeWindowMinutes
        - type
        - horizonPasses
        - revisions
        - status
        - createdAt
        - updatedAt

    ProfileSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        birthDate: { type: string }
        birthTime: { type: string }
        birthPlace: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        timezoneOffset: { type: number }
        timezone: { type: string, nullable: true }
        birthTimeWindowMinutes: { type: integer }
        horizon:
          type: string
          enum: [known, approximate, unknown]
          nullable: true
        sunSign: { type: string, nullable: true }
        moonSign: { type: string, nullable: true }
        risingSign: { type: string, nullable: true }
        createdAt: { type: string }
        ownership:
          type: string
          enum: [owner, claimed, invited, unclaimed]
          description: Viewer-relative ownership status of the profile.
        claimedByName: { type: string, nullable: true }
        inviteEmail: { type: string, nullable: true }
        isSelf:
          type: boolean
          description: >
            True if this is the viewer's own chart from the viewer's side: the
            owner's is_self, set by the "Generate My Chart" flow (isForSelf=true
            in POST /reports), or the claimer's claimed_as_self (ADR-120).
            Never derived by heuristic. Always false for anonymous viewers.
        claimedAsSelf:
          type: boolean
          description: The claimer marked this sent chart as their own, This is me; false after Not me and on the owner's charts (ADR-120).
        giverName:
          type: string
          nullable: true
          description: First name of whoever sent this chart to the viewer; null on the viewer's own (ADR-139).
        send:
          description: Send to {name} for this person; null where it is not offered (ADR-120, ADR-139).
          anyOf:
            - $ref: "#/components/schemas/SendState"
            - type: "null"
      required: [id, name, birthDate, birthTime, birthPlace, createdAt]

