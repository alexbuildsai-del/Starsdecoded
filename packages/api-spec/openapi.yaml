        birthDate:
          type: string
        birthTime:
          type: string
        birthTimeWindowMinutes:
          type: number
        birthPlace:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        isSelf:
          type: boolean
          description: The viewer's own chart from the viewer's side, the owner's is_self or the claimer's claimed_as_self; the hero puts it on the left (ADR-70, ADR-120).
        chartData:
          $ref: "#/components/schemas/ChartData"
          nullable: true
      required: [id, reportId, name, role, birthDate, birthTime, birthTimeWindowMinutes, birthPlace, latitude, longitude, isSelf, chartData]

