      required: [text, claims]

    HorizonPass:
      description: What the last horizon pass changed. Counts are the report's own; the page never recounts them (ADR-35).
      type: object
      properties:
        at:
          type: string
        passes:
          type: integer
        sentencesRevised:
          type: integer
        paragraphsAdded:
          type: integer
        sections:
          type: object
          additionalProperties:
            type: object
            properties:
              amended:
                type: array
                items:
                  $ref: "#/components/schemas/SectionRevisionMark"
              added:
                type: array
                items:
                  $ref: "#/components/schemas/SectionAddition"
            required: [amended, added]
      required: [at, passes, sentencesRevised, paragraphsAdded, sections]

    ReportInterpretation:
      description: >
        A report. Every section is schema-enforced at generation time, so a
        section that is present is complete. Only `meta` is required, because
        the report is readable while it writes and sections arrive one at a
        time. A natal report carries the natal sections; a compatibility report
        the pair sections (`meta.reportType`). A natal report whose horizon is
        unknown has no `houses`, no `triad.rising` and no `angleMeanings`.
      type: object
      properties:
        meta:
          type: object
          properties:
            promptVersion:
              type: string
            reportType:
              type: string
              enum: [natal, compatibility]
            lens:
              $ref: "#/components/schemas/RelationshipType"
            label:
              type: string
              nullable: true
              description: How two people know each other, in their words; null under the other lenses.
            band:
              type: string
              nullable: true
              enum: [little, school, teen, grown]
              description: The child's age band under the parent lens, derived from the birth date at generation (ADR-67); null otherwise.
            horizon:
              type: string
              enum: [known, approximate, unknown]
              description: Mirrors the chart's horizon status (ADR-34).
            horizonPass:
              $ref: "#/components/schemas/HorizonPass"
            model:
              description: >
                The model every call used, or "mixed" when the foundation and
                the sections differ. See usage.sections[].model for each one.
              type: string
            houseSystem:
              type: string
              enum: [whole-sign]
            generatedAt:
              type: string
            wordCount:
              type: number
            zodiac:
              type: string
            ephemeris:
              type: string
            orbs:
              type: object
              additionalProperties:
                type: number
            sect:
              type: string
              enum: [day, night]
              description: Absent when the horizon is unknown, as are sectLight, sunAltitude and sectMarginal.
            sectLight:
              type: string
              enum: [sun, moon]
            sunAltitude:
              type: number
            sectMarginal:
              type: boolean
            usage:
              description: >
                Tokens, cost and time for the eleven generation calls.
                Optional: reports generated before R02 have no usage block.
                `inputTokens` excludes `cachedInputTokens`, and
                `reasoningTokens` is a subset of `outputTokens`, never added
                on top of it.
              type: object
              properties:
                model:
                  description: The model every call used, or "mixed" when they differ.
                  type: string
                costUsd:
                  description: >
                    Priced per section on its own model and summed, when
                    generated. Null if any model has no price on record.
                  type: number
                  nullable: true
                wallClockMs:
                  description: End to end. Below `totals.ms`, because ten sections run at once.
                  type: number
                totals:
                  $ref: "#/components/schemas/UsageTotals"
                sections:
                  type: array
                  items:
                    allOf:
                      - $ref: "#/components/schemas/UsageTotals"
                      - type: object
                        properties:
                          section:
                            description: Prompt key, e.g. "natal:overview".
                            type: string
                          model:
                            description: The model this section's calls ran on.
                            type: string
                        required: [section, model]
              required: [model, costUsd, wallClockMs, totals, sections]
          required: [promptVersion, model, houseSystem, generatedAt, wordCount, zodiac, ephemeris, orbs]
        overview:
          type: object
          properties:
            headline:
              type: string
            concentration:
              type: string
            temperament:
              type: string
            distinctive:
              type: string
            bridge:
              type: string
            claims:
              type: array
              items:
