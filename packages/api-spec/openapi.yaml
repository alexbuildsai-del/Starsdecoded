        type: { type: string }
        orb: { type: number }
      required: [dynamic, inFlow, underStress, growth, planetA, planetB, type, orb]

    SynastryInterpretation:
      type: object
      properties:
        overview: { type: string }
        emotional: { type: string }
        communication: { type: string }
        physical: { type: string }
        conflict: { type: string }
        growth: { type: string }
        topAspectMeanings:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SynastryAspectMeaning"
      required: [overview, emotional, communication, physical, conflict, growth, topAspectMeanings]

    SynastryReportParticipant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        birthDate: { type: string }
        birthPlace: { type: string }
        sunSign: { type: string, nullable: true }
        moonSign: { type: string, nullable: true }
        risingSign: { type: string, nullable: true }
        ownership:
          type: string
          enum: [owner, claimed, invited, unclaimed]
        claimedByName: { type: string, nullable: true }
        inviteEmail: { type: string, nullable: true }
        selfProfile:
          type: boolean
          description: True iff this profile is the authenticated viewer's own claimed self.
      required: [id, name, role, birthDate, birthPlace]

    SynastryReport:
      type: object
      properties:
        id: { type: string }
        relationshipId: { type: string }
        type: { type: string }
        label: { type: string, nullable: true }
        status:
          type: string
          enum: [pending, computing, interpreting, complete, failed]
        participants:
          type: array
          items:
            $ref: "#/components/schemas/SynastryReportParticipant"
        compute:
          $ref: "#/components/schemas/SynastryCompute"
          nullable: true
        interpretation:
          $ref: "#/components/schemas/SynastryInterpretation"
          nullable: true
        errorMessage: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
        ownership:
          type: string
          enum: [owner, participant, viewer]
          description: |
            Viewer-relative role on this report.
            - owner: created the underlying relationship.
            - participant: claimed an invite tied to this relationship.
            - viewer: read-only access via a valid invite token (no claim).
      required: [id, relationshipId, type, status, participants, createdAt, updatedAt]

    InviteRecord:
      type: object
      description: A single invite token row as visible to the sender
      properties:
        id: { type: string }
        email: { type: string }
        profileId: { type: string }
        relationshipId: { type: string, nullable: true }
        sentAt: { type: string, description: "ISO-8601 timestamp when the invite was created" }
        expiresAt: { type: string }
        emailDelivered: { type: boolean, nullable: true, description: "null means unknown (pre-migration)" }
        claimedAt: { type: string, nullable: true }
      required: [id, email, profileId, sentAt, expiresAt]

    CreateInviteBody:
      type: object
      properties:
        profileId: { type: string }
        relationshipId: { type: string, nullable: true }
        email: { type: string, format: email }
      required: [profileId, email]

    InviteSummary:
      type: object
      properties:
        id: { type: string }
        token: { type: string }
        email: { type: string }
        profileId: { type: string }
        relationshipId: { type: string, nullable: true }
        expiresAt: { type: string }
        claimUrl: { type: string }
        emailDelivered: { type: boolean }
      required: [id, token, email, profileId, expiresAt, claimUrl, emailDelivered]

    InvitePreview:
      type: object
      properties:
        token: { type: string }
        email: { type: string }
        inviterName:
          type: string
          nullable: true
          description: The giver's first name, never an email (ADR-135, MB-85).
        profileName: { type: string }
        relationshipId: { type: string, nullable: true }
        relationshipReportId: { type: string, nullable: true }
        expiresAt: { type: string }
        alreadyClaimed: { type: boolean }
        kind:
          type: string
          enum: [send, gift]
          description: A sent report or a gifted credit (ADR-120, ADR-139).
        recipientName:
          type: string
          nullable: true
          description: The name the giver gave a gift's recipient, for the cover; null on a send (ADR-128).
        note:
          type: string
          nullable: true
          description: The giver's note on a gift's cover, at most 280 characters; null without one (ADR-128).
      required: [token, email, profileName, expiresAt, alreadyClaimed]

    InviteClaimResponse:
      type: object
      properties:
        profileId: { type: string }
        relationshipId: { type: string, nullable: true }
        relationshipReportId: { type: string, nullable: true }
        redirectTo:
          type: string
          description: Where the claim lands; a gift answers /dashboard (ADR-139).
        kind:
          type: string
          enum: [send, gift]
          description: A sent report or a gifted credit (ADR-120, ADR-139).
        askSelf:
          type: boolean
          description: Ask "Is this you?", only when the claimer already has a self profile; otherwise a sent chart is theirs at once (ADR-120).
      required: [profileId, redirectTo]

    Gift:
      type: object
      description: A gift as its giver sees it, a held credit and a state, never anything the recipient makes (ADR-123, ADR-139).
      properties:
        id: { type: string }
        recipientName: { type: string }
        email: { type: string }
        note: { type: string, nullable: true }
        sentAt: { type: string, description: "ISO-8601 timestamp when the gift went out" }
        returnsAt:
          type: string
          description: When the held credit returns if the gift is still unclaimed, 30 days after sentAt (ADR-123).
        remindedAt: { type: string, nullable: true, description: "The last reminder; null before any" }
        state:
          type: string
          enum: [waiting, claimed, returned]
          description: Waiting until claimed; returned once taken back or unclaimed at returnsAt (ADR-123).
        creditHeld:
          type: boolean
          description: True while one of the giver's credits is held for it (ADR-123); false once claimed or returned, or when the soft pass held none (MB-6 provisional).
      required: [id, recipientName, email, note, sentAt, returnsAt, remindedAt, state, creditHeld]

    CreateGiftBody:
      type: object
      description: Gift a report to someone by name and email, with a note for the cover (ADR-128, ADR-139).
      properties:
        recipientName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        note: { type: string, maxLength: 280 }
      required: [recipientName, email]

    GeocodeResult:
      type: object
      properties:
        name:
          type: string
          description: Full display name (City, Region, Country)
        city:
          type: string
          description: City/town/village name
        region:
          type: string
          description: State or region name
        country:
          type: string
          description: Country name
        latitude:
          type: number
        longitude:
          type: number
        timezoneOffset:
          type: number
          description: UTC offset in hours
        timezone:
          type: string
          description: IANA zone name of the place, when known.
        placeType:
          type: string
          description: Nominatim place type (city, town, village, administrative, etc.)
      required:
        - name
        - latitude
        - longitude
        - timezoneOffset
        - placeType

    GeocodeSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/GeocodeResult"
      required:
        - results

    CreditBalance:
      type: object
      properties:
        available:
          type: integer
          description: Number of credits available to use
        used:
          type: integer
          description: Number of credits already consumed
      required: [available, used]

    CreditCounts:
      type: object
      description: One credit kind (ADR-42). The typed breakdown went with it; the columns drop with payments (MB-57).
      properties:
        available:
          type: integer
        used:
          type: integer
        held:
          type: integer
          description: Credits held for waiting gifts, outside available until claimed or returned (ADR-123).
        lastBundle:
          type: object
          nullable: true
          description: The newest bundle, which the path after buying plans from; null before any (ADR-125).
          properties:
            id: { type: string }
            count: { type: integer }
            createdAt: { type: string }
          required: [id, count, createdAt]
      required: [available, used]

    CreditHistoryItem:
      type: object
      description: One line of History, bought, a gift received or spent (ADR-129).
      properties:
        kind:
          type: string
          enum: [bought, gift, spent]
        count:
          type: integer
          description: Credits the line moves, a positive number; bought and gift add them, spent takes them away.
        date: { type: string, description: "ISO-8601 timestamp of the line" }
        label:
          type: string
          description: What the line reads, "A gift from {giver}" on a gift, the report's name when spent, "Gift to {name}" on the giver's side once claimed.
        test:
          type: boolean
          description: A test bundle's line, which says so (ADR-138).
      required: [kind, count, date, label, test]

    TestCheckoutBody:
      type: object
      description: A test bundle of 1, 3 or 5 credits (ADR-138).
      properties:
        count:
          type: integer
          enum: [1, 3, 5]
      required: [count]
