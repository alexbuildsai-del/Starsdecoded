packages:
  - web
  - api
  - mobile
  - packages/*
  - packages/integrations/*
  - scripts
  - e2e

# On, as every lockfile so far was resolved (pnpm 10.0 never read this key); off drops the react peer from two packages.
autoInstallPeers: true
# ADR-200: a hijacked release is usually pulled within days, so nothing younger than 7 days (in minutes) resolves.
minimumReleaseAge: 10080

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.2.8
  react-dom: 19.2.8
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: 4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver
