packages:
  - web
  - api
  - mobile
  - packages/*
  - packages/integrations/*
  - scripts
  - e2e

# On, as every lockfile so far was resolved (pnpm 10.0 never read this key); off drops the react peer from two packages.
autoInstallPeers: true
# ADR-200: a hijacked release is usually pulled within days, so nothing younger than 7 days (in minutes) resolves.
minimumReleaseAge: 10080
# MB-157 provisional: a package an advisory names may be listed for its fix (name@version), with the date, and leaves after 7 days.
minimumReleaseAgeExclude: []

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.103.2
  '@types/node': ^25.3.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.3
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.1.14
  tsx: 4.23.15
  vite: ^7.3.2
  wouter: ^3.11.1
  zod: ^3.25.76

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver
