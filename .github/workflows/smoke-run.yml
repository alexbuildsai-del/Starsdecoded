name: Smoke run

# Reusable body of the deploy check. smoke.yml and promote.yml call it with
# the web URL to probe and the environment the API behind it must report.
# It reads public URLs and holds no secret or key. Its one post is a foreign
# page's write the API must refuse, with an empty body nothing would store.
on:
  workflow_call:
    inputs:
      web_url:
        description: Web origin to probe, with trailing slash
        required: true
        type: string
      expect_env:
        description: Value /api/healthz must report as env
        required: true
        type: string
      expect_commit:
        description: Git sha /api/healthz must report as commit; empty to skip
        required: false
        type: string
        default: ""

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WEB_URL: ${{ inputs.web_url }}
      EXPECT_ENV: ${{ inputs.expect_env }}
      EXPECT_COMMIT: ${{ inputs.expect_commit }}
      DEADLINE_SECONDS: 600
    steps:
      # Only the probe script, from the commit under test, so the probe and the deploy it judges change together.
      - name: Check out the security probe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Wait for the web app
        run: |
          end=$((SECONDS + DEADLINE_SECONDS))
          until curl -sSf --max-time 20 "$WEB_URL" -o index.html && grep -q 'id="root"' index.html; do
            if [ "$SECONDS" -ge "$end" ]; then
              echo "::error::$WEB_URL did not return 200 with the app root div within ${DEADLINE_SECONDS}s"
              exit 1
            fi
            sleep 15
          done
          echo "web ok: $WEB_URL"

      # The web app calls /api on its own origin and vercel.json rewrites it
      # to Railway, so the origin that matters is the web URL itself. Any
      # Railway host found in a bundle is probed too, in case a build was
      # made with VITE_API_BASE_URL set.
      - name: List the origins the built bundles talk to
        run: |
          : > found.txt
          for asset in $(grep -oE '/assets/[^"'"'"' ]+\.js' index.html | sort -u); do
            curl -sS --max-time 20 "${WEB_URL%/}$asset" | grep -oE 'https://[A-Za-z0-9.-]+\.[a-z]{2,}' >> found.txt || true
          done
          sort -u found.txt | grep -vE 'clerk\.|w3\.org|openstreetmap|timeapi|nominatim|github\.com|reactjs|npmjs|vercel\.app' > origins.txt || true
          echo "origins in bundles (candidates for the API):"; cat origins.txt || true
          { echo "${WEB_URL%/}"; grep railway origins.txt || true; } > candidates.txt
          echo "probe order:"; cat candidates.txt

      # A healthy answer is not enough: it must come from the right
      # deployment. A preview host rewritten to the production API, or a
      # Railway build that has not rolled over yet, both fail here.
      - name: Wait for the API health check
        run: |
          end=$((SECONDS + DEADLINE_SECONDS))
          while :; do
            for o in $(cat candidates.txt); do
              body=$(curl -sSf --max-time 20 "$o/api/healthz" 2>/dev/null || true)
              [ -n "$body" ] || continue
              status=$(printf '%s' "$body" | jq -r '.status // empty')
              env=$(printf '%s' "$body" | jq -r '.env // empty')
              commit=$(printf '%s' "$body" | jq -r '.commit // empty')
              if [ "$status" != "ok" ]; then continue; fi
              if [ "$env" != "$EXPECT_ENV" ]; then
                echo "$o answers as env=$env, expected $EXPECT_ENV (a web host rewritten to the wrong API, or APP_ENV unset on Railway)"
                last_mismatch="env=$env"
                continue
              fi
              if [ -n "$EXPECT_COMMIT" ] && [ "$commit" != "$EXPECT_COMMIT" ]; then
                echo "$o is env=$env but commit=${commit:-none}, waiting for $EXPECT_COMMIT"
                last_mismatch="commit=${commit:-none}"
                continue
              fi
              echo "API_URL=$o" >> "$GITHUB_ENV"
              echo "API_ENV=$env" >> "$GITHUB_ENV"
              echo "API_COMMIT=${commit:-none}" >> "$GITHUB_ENV"
              echo "api ok: $o/api/healthz env=$env commit=${commit:-none}"
              exit 0
            done
            if [ "$SECONDS" -ge "$end" ]; then
              echo "::error::No candidate answered /api/healthz as env=$EXPECT_ENV${EXPECT_COMMIT:+ commit=$EXPECT_COMMIT} within ${DEADLINE_SECONDS}s (last mismatch: ${last_mismatch:-no healthy answer}). Tried: $(tr '\n' ' ' < candidates.txt)"
              exit 1
            fi
            sleep 15
          done

      # Informational: a healthy API with a broken database is the failure
      # mode the liveness probe cannot see. Warned, not asserted, so a
      # database incident does not block promotion checks it cannot fix,
      # but it shows on the run instead of only inside this step's log.
      - name: Database probe
        run: |
          body=$(curl -sS --max-time 30 "$API_URL/api/healthz/db" || echo '{"ok":false,"error":"no answer"}')
          echo "database: $body"
          echo "API_DB=$body" >> "$GITHUB_ENV"
          if [ "$(printf '%s' "$body" | jq -r '.ok // false')" != "true" ]; then
            echo "::warning::$API_URL/api/healthz/db reports a broken database: $body"
          elif printf '%s' "$body" | jq -r '.bootstrap // ""' | grep -q FAILED; then
            echo "::warning::$API_URL/api/healthz/db reports the prompt copy from staging failed; the seeded defaults are serving: $body"
          fi

      # What a crawler is handed. Whether the site asks to be found is the one
      # thing production and staging disagree on, so that follows EXPECT_ENV;
      # everything else holds on both hosts. The web deploy can land after the
      # API's, so a failing pass is retried until the deadline.
      - name: Crawl surface
        run: |
          base="${WEB_URL%/}"
          bot='Mozilla/5.0 (compatible; OAI-SearchBot/1.0; +https://openai.com/searchbot)'
          work=$(mktemp -d)
          closed='^[[:space:]]*Disallow:[[:space:]]*/[[:space:]]*$'
          google='fonts\.(googleapis|gstatic)\.com'
          problems=""
          pages=0
          note() { problems="${problems}${1}"$'\n'; }

          audit() {
            problems=""
            pages=0
            rm -f "$work"/*

            for f in robots.txt sitemap.xml llms.txt; do
              code=$(curl -sS --max-time 20 -o "$work/$f" -w '%{http_code}' "$base/$f" 2>/dev/null || true)
              if [ "$code" != 200 ]; then note "/$f answered ${code:-nothing}, expected 200"; fi
            done
            if ! grep -qi '^User-agent:' "$work/robots.txt" 2>/dev/null; then note "robots.txt names no User-agent"; fi
            if ! grep -q '<urlset' "$work/sitemap.xml" 2>/dev/null; then note "sitemap.xml is not a sitemap"; fi
            if ! head -n 1 "$work/llms.txt" 2>/dev/null | grep -q '^# '; then note "llms.txt does not open with a title"; fi

            code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$base/no-such-page" 2>/dev/null || true)
            if [ "$code" != 404 ]; then note "/no-such-page answered ${code:-nothing}, expected 404"; fi

            curl -sS --max-time 20 -D "$work/dashboard.headers" -o /dev/null "$base/dashboard" 2>/dev/null || true
            if ! grep -qi '^x-robots-tag:.*noindex' "$work/dashboard.headers" 2>/dev/null; then note "/dashboard carries no X-Robots-Tag: noindex"; fi

            # The sitemap is the crawler's map, so every page it lists must reach the crawler with its H1 already in the HTML (R-7.6), not only the home page.
            code=$(curl -sS --max-time 20 -A "$bot" -D "$work/home.headers" -o "$work/home.html" -w '%{http_code}' "$base/" 2>/dev/null || true)
            if [ "$code" != 200 ]; then note "/ answered ${code:-nothing} to OAI-SearchBot, expected 200"; fi
            if ! grep -qi '<h1' "$work/home.html" 2>/dev/null; then note "/ sent OAI-SearchBot no <h1>"; fi
            for p in $(grep -oE '<loc>[^<]+</loc>' "$work/sitemap.xml" 2>/dev/null | sed -E 's#</?loc>##g; s#^https?://[^/]+##' | sed '/^\/$/d;/^$/d' | sort -u); do
              code=$(curl -sS --max-time 20 -A "$bot" -o "$work/page.html" -w '%{http_code}' "$base$p" 2>/dev/null || true)
              if [ "$code" != 200 ]; then note "$p is in the sitemap but answered ${code:-nothing} to OAI-SearchBot"; continue; fi
              if ! grep -qi '<h1' "$work/page.html"; then note "$p sent OAI-SearchBot no <h1>"; fi
              pages=$((pages + 1))
            done

            # The fonts come from our own origin (R11-04), so a page, stylesheet or script naming Google's font hosts has brought back a third-party request on every visit.
            if grep -qE "$google" "$work/home.html" 2>/dev/null; then note "the home page names Google's font hosts"; fi
            for a in $(grep -oE '/assets/[^"'"'"' ]+\.(js|css)' "$work/home.html" 2>/dev/null | sort -u); do
              rm -f "$work/asset"
              curl -sS --max-time 20 -o "$work/asset" "$base$a" 2>/dev/null || true
              if grep -qE "$google" "$work/asset" 2>/dev/null; then note "$a names Google's font hosts"; fi
            done

            asks_out=false
            if grep -qi '^x-robots-tag:.*noindex' "$work/home.headers" 2>/dev/null || grep -qiE '<meta name="robots"[^>]*noindex' "$work/home.html" 2>/dev/null; then asks_out=true; fi
            case "$EXPECT_ENV" in
              production)
                if cat "$work/robots.txt" 2>/dev/null | tr -d '\r' | grep -qE "$closed"; then note "robots.txt turns every crawler away on production"; fi
                if ! grep -qi '^Sitemap:.*sitemap\.xml' "$work/robots.txt" 2>/dev/null; then note "robots.txt names no sitemap on production"; fi
                if $asks_out; then note "the home page asks not to be indexed on production"; fi
                ;;
              staging)
                if ! cat "$work/robots.txt" 2>/dev/null | tr -d '\r' | grep -qE "$closed"; then note "robots.txt does not turn crawlers away on staging"; fi
                if ! $asks_out; then note "the home page does not ask to stay out of search on staging"; fi
                ;;
            esac
            return 0
          }

          end=$((SECONDS + DEADLINE_SECONDS))
          while :; do
            audit
            if [ -z "$problems" ]; then
              echo "crawl surface ok at $base: robots.txt, sitemap.xml and llms.txt, $((pages + 1)) pages read as OAI-SearchBot, /no-such-page 404, /dashboard noindex, no Google fonts"
              echo "CRAWL_PAGES=$((pages + 1))" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$SECONDS" -ge "$end" ]; then
              printf '%s' "$problems" | while IFS= read -r line; do echo "::error::$base: $line"; done
              exit 1
            fi
            echo "crawl surface not right yet at $base, waiting for the deploy:"; printf '%s' "$problems"
            sleep 15
          done

      # The runtime half of the security gate (ADR-193, 197, 198). A preview's /api is staging's API, so a preview runs only
      # the web half (site-checks.yml); the API half runs here, on staging after every merge and on production after every
      # promote. The script reads DEADLINE_SECONDS and retries like the steps above.
      - name: Security probe
        run: .github/scripts/security-probe.sh "$WEB_URL" full

      - name: Summary
        run: |
          printf '## Smoke\n- Web: %s\n- API: %s/api/healthz\n- env: %s\n- commit: %s\n- database: %s\n- crawl: %s pages read as OAI-SearchBot\n- security: headers and CSP, no CORS, a foreign write refused, the session cookie Lax and Secure\n' "$WEB_URL" "$API_URL" "$API_ENV" "$API_COMMIT" "$API_DB" "$CRAWL_PAGES" >> "$GITHUB_STEP_SUMMARY"
