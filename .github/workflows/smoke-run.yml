name: Smoke run

# Reusable body of the deploy check. smoke.yml and promote.yml call it with
# the web URL to probe and the environment the API behind it must report.
on:
  workflow_call:
    inputs:
      web_url:
        description: Web origin to probe, with trailing slash
        required: true
        type: string
      expect_env:
        description: Value /api/healthz must report as env
        required: true
        type: string
      expect_commit:
        description: Git sha /api/healthz must report as commit; empty to skip
        required: false
        type: string
        default: ""

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      WEB_URL: ${{ inputs.web_url }}
      EXPECT_ENV: ${{ inputs.expect_env }}
      EXPECT_COMMIT: ${{ inputs.expect_commit }}
      DEADLINE_SECONDS: 600
    steps:
      - name: Wait for the web app
        run: |
          end=$((SECONDS + DEADLINE_SECONDS))
          until curl -sSf --max-time 20 "$WEB_URL" -o index.html && grep -q 'id="root"' index.html; do
            if [ "$SECONDS" -ge "$end" ]; then
              echo "::error::$WEB_URL did not return 200 with the app root div within ${DEADLINE_SECONDS}s"
              exit 1
            fi
            sleep 15
          done
          echo "web ok: $WEB_URL"

      # The web app calls /api on its own origin and vercel.json rewrites it
      # to Railway, so the origin that matters is the web URL itself. Any
      # Railway host found in a bundle is probed too, in case a build was
      # made with VITE_API_BASE_URL set.
      - name: List the origins the built bundles talk to
        run: |
          : > found.txt
          for asset in $(grep -oE '/assets/[^"'"'"' ]+\.js' index.html | sort -u); do
            curl -sS --max-time 20 "${WEB_URL%/}$asset" | grep -oE 'https://[A-Za-z0-9.-]+\.[a-z]{2,}' >> found.txt || true
          done
          sort -u found.txt | grep -vE 'googleapis|gstatic|clerk\.|w3\.org|openstreetmap|timeapi|nominatim|github\.com|reactjs|npmjs|vercel\.app' > origins.txt || true
          echo "origins in bundles (candidates for the API):"; cat origins.txt || true
          { echo "${WEB_URL%/}"; grep railway origins.txt || true; } > candidates.txt
          echo "probe order:"; cat candidates.txt

      # A healthy answer is not enough: it must come from the right
      # deployment. A preview host rewritten to the production API, or a
      # Railway build that has not rolled over yet, both fail here.
      - name: Wait for the API health check
        run: |
          end=$((SECONDS + DEADLINE_SECONDS))
          while :; do
            for o in $(cat candidates.txt); do
              body=$(curl -sSf --max-time 20 "$o/api/healthz" 2>/dev/null || true)
              [ -n "$body" ] || continue
              status=$(printf '%s' "$body" | jq -r '.status // empty')
              env=$(printf '%s' "$body" | jq -r '.env // empty')
              commit=$(printf '%s' "$body" | jq -r '.commit // empty')
              if [ "$status" != "ok" ]; then continue; fi
              if [ "$env" != "$EXPECT_ENV" ]; then
                echo "$o answers as env=$env, expected $EXPECT_ENV (a web host rewritten to the wrong API, or APP_ENV unset on Railway)"
                last_mismatch="env=$env"
                continue
              fi
              if [ -n "$EXPECT_COMMIT" ] && [ "$commit" != "$EXPECT_COMMIT" ]; then
                echo "$o is env=$env but commit=${commit:-none}, waiting for $EXPECT_COMMIT"
                last_mismatch="commit=${commit:-none}"
                continue
              fi
              echo "API_URL=$o" >> "$GITHUB_ENV"
              echo "API_ENV=$env" >> "$GITHUB_ENV"
              echo "API_COMMIT=${commit:-none}" >> "$GITHUB_ENV"
              echo "api ok: $o/api/healthz env=$env commit=${commit:-none}"
              exit 0
            done
            if [ "$SECONDS" -ge "$end" ]; then
              echo "::error::No candidate answered /api/healthz as env=$EXPECT_ENV${EXPECT_COMMIT:+ commit=$EXPECT_COMMIT} within ${DEADLINE_SECONDS}s (last mismatch: ${last_mismatch:-no healthy answer}). Tried: $(tr '\n' ' ' < candidates.txt)"
              exit 1
            fi
            sleep 15
          done

      # Informational: a healthy API with a broken database is the failure
      # mode the liveness probe cannot see. Printed, not asserted, so a
      # database incident does not block promotion checks it cannot fix.
      - name: Database probe
        run: |
          body=$(curl -sS --max-time 30 "$API_URL/api/healthz/db" || echo '{"ok":false,"error":"no answer"}')
          echo "database: $body"
          echo "API_DB=$body" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          printf '## Smoke\n- Web: %s\n- API: %s/api/healthz\n- env: %s\n- commit: %s\n- database: %s\n' "$WEB_URL" "$API_URL" "$API_ENV" "$API_COMMIT" "$API_DB" >> "$GITHUB_STEP_SUMMARY"
