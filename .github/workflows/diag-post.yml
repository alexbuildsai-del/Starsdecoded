name: Diag POST

# Temporary end-to-end verification of the 405 fix: drive the real staging
# form in a headless browser and capture the reports request. Expect 201 and a
# same-origin URL. Delete once confirmed.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright chromium
        run: npm i -D playwright@1.48.0 && npx playwright install --with-deps chromium
      - name: Drive the real form and capture the reports request
        run: |
          cat > repro.mjs <<'JS'
          import { chromium } from 'playwright';
          const V = 'https://starsdecoded-staging.vercel.app';
          const b = await chromium.launch();
          const page = await (await b.newContext()).newPage();
          const hits = [];
          page.on('requestfinished', async (r) => {
            if (!r.url().includes('/reports')) return;
            const res = await r.response();
            hits.push({ method: r.method(), url: r.url(), status: res ? res.status() : null });
          });
          await page.goto(V, { waitUntil: 'networkidle' });
          await page.getByPlaceholder(/name/i).fill('staging test').catch(()=>{});
          try { await page.locator('input[type="date"]').fill('1995-08-23'); } catch {}
          try { await page.locator('input[type="time"]').fill('23:45'); } catch {}
          try {
            await page.getByPlaceholder(/place|city|birth/i).first().fill('Košice');
            await page.waitForTimeout(2500);
            await page.getByText(/Košice/).first().click({ timeout: 4000 });
          } catch (e) { console.log('place step:', e.message); }
          await page.waitForTimeout(500);
          try { await page.getByRole('button', { name: /generate my report/i }).click({ timeout: 4000 }); } catch (e) { console.log('click:', e.message); }
          await page.waitForTimeout(6000);
          console.log('REPORTS_REQUESTS=' + JSON.stringify(hits, null, 2));
          await b.close();
          JS
          node repro.mjs
