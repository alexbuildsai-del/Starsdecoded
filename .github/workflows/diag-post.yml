name: Diag POST

# Temporary diagnostic for the staging 405 on POST /api/reports. Plain POST
# reaches the API (400 validation), so the browser 405 is the CORS preflight.
# This probes OPTIONS and reads what origin the built bundle calls. Delete
# once resolved.
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight probe
        run: |
          probe() {
            echo "=== $*"
            curl -sS -i "$@" --max-time 25 \
              | sed -n '1,25p' \
              | grep -iE '^HTTP/|^allow:|^server:|^access-control|^x-vercel|^x-railway|^content-type:|^location:|not allowed|<title>|error' \
              || true
            echo
          }
          V=https://starsdecoded-staging.vercel.app
          R=https://starsdecoded-staging.up.railway.app
          O="-H Origin:$V -H Access-Control-Request-Method:POST -H Access-Control-Request-Headers:content-type"
          probe -X OPTIONS $O "$V/api/reports"
          probe -X OPTIONS $O "$R/api/reports"

      - name: What origin does the built bundle call
        run: |
          V=https://starsdecoded-staging.vercel.app
          curl -sS "$V/" -o index.html
          echo "assets referenced:"; grep -oE '/assets/[^"]+\.js' index.html | sort -u
          for a in $(grep -oE '/assets/[^"]+\.js' index.html | sort -u); do
            curl -sS "$V$a" -o bundle.js
            echo "--- $a : railway/api-base references ---"
            grep -oE 'https://[a-z0-9.-]*railway[a-z0-9.-]*' bundle.js | sort -u || true
            grep -oE 'VITE_API_BASE_URL|api-base|apiOrigin' bundle.js | sort -u || true
          done
