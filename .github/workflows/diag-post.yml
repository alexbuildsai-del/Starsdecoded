name: Diag POST

# Temporary: incognito still 405s, so it is not cache. Extract the API origin
# the deployed staging bundle actually posts to, and drive the real form in a
# headless browser to capture the failing request. Delete once resolved.
on:
  workflow_dispatch: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Extract the API origin baked into the staging bundle
        run: |
          V=https://starsdecoded-staging.vercel.app
          curl -sS "$V/" -o index.html
          asset=$(grep -oE '/assets/[^"]+\.js' index.html | sort -u | head -1)
          echo "bundle: $asset"
          curl -sS "$V$asset" -o bundle.js
          echo "=== absolute URL literals in the bundle ==="
          grep -oE 'https?://[A-Za-z0-9._~:/?#@!$&()*+,;=-]+' bundle.js | sort -u | grep -viE 'w3\.org|schema|googleapis|gstatic|clerk|nominatim|openstreetmap|timeapi|react|vercel\.com|github|npmjs' | head -40
          echo
          echo "=== context around the api-origin computation (replace(/\\/+\$/)) ==="
          grep -oE '.{80}replace\(/\\?/\+\$/.{40}' bundle.js | head -5 || true
          echo
          echo "=== every occurrence of api/reports and surrounding 60 chars ==="
          grep -oE '.{60}api/reports.{20}' bundle.js | head -5 || true

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright chromium
        run: npm i -D playwright@1.48.0 && npx playwright install --with-deps chromium
      - name: Drive the real form and capture the reports request
        run: |
          cat > repro.mjs <<'JS'
          import { chromium } from 'playwright';
          const V = 'https://starsdecoded-staging.vercel.app';
          const b = await chromium.launch();
          const ctx = await b.newContext();
          const page = await ctx.newPage();
          const hits = [];
          page.on('requestfinished', async (r) => {
            if (!r.url().includes('/reports')) return;
            const res = await r.response();
            hits.push({ method: r.method(), url: r.url(), status: res ? res.status() : null,
                        server: res ? (res.headers()['server']||'') : '', allow: res ? (res.headers()['allow']||'') : '' });
          });
          page.on('requestfailed', (r) => { if (r.url().includes('/reports')) hits.push({ method: r.method(), url: r.url(), failed: r.failure()?.errorText }); });
          await page.goto(V, { waitUntil: 'networkidle' });
          // Fill the birth form.
          await page.getByPlaceholder(/name/i).fill('staging test').catch(()=>{});
          try { await page.locator('input[type="date"]').fill('1995-08-23'); } catch {}
          try { await page.locator('input[type="time"]').fill('23:45'); } catch {}
          const place = page.getByPlaceholder(/place|city|birth place/i).first();
          try {
            await place.fill('Košice');
            await page.waitForTimeout(2500);
            await page.getByText(/Košice/).first().click({ timeout: 4000 });
          } catch (e) { console.log('place step:', e.message); }
          await page.waitForTimeout(500);
          const btn = page.getByRole('button', { name: /generate my report/i });
          try { await btn.click({ timeout: 4000 }); } catch (e) { console.log('click:', e.message); }
          await page.waitForTimeout(6000);
          console.log('REPORTS_REQUESTS=' + JSON.stringify(hits, null, 2));
          await b.close();
          JS
          node repro.mjs
