name: Diag POST

# Temporary diagnostic for the staging 405 on POST /api/reports. Reproduces the
# exact browser request (full valid body) through Vercel, follows redirects,
# and prints every response in the chain. Delete once resolved.
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Full valid POST through Vercel, following redirects
        run: |
          V=https://starsdecoded-staging.vercel.app
          body='{"name":"staging test","birthDate":"1995-08-23","birthTime":"23:45","birthPlace":"Košice, Košický kraj, Slovensko","latitude":48.72,"longitude":21.25,"timezoneOffset":2,"isForSelf":true}'
          echo "=== POST $V/api/reports (with redirects shown) ==="
          curl -sS -i -L --max-redirs 5 \
            -H 'content-type: application/json' \
            -H "Origin: $V" \
            --data "$body" --max-time 30 "$V/api/reports" \
            | grep -iE '^HTTP/|^allow:|^server:|^location:|^access-control-allow-methods|^content-type:|error|reportId|"id"|not allowed' \
            || true
          echo
          echo "=== same POST straight to Railway ==="
          R=https://starsdecoded-staging.up.railway.app
          curl -sS -i --max-time 30 \
            -H 'content-type: application/json' \
            --data "$body" "$R/api/reports" \
            | grep -iE '^HTTP/|^allow:|^server:|^location:|^content-type:|error|"id"' \
            || true
