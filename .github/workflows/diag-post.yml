name: Diag POST

# Temporary: confirm the deployed staging bundle no longer bakes a cross-origin
# API base (the 405 cause) and now calls /api same-origin. Delete once green.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Assert the staging bundle uses a same-origin API base
        run: |
          V=https://starsdecoded-staging.vercel.app
          curl -sS "$V/" -o index.html
          asset=$(grep -oE '/assets/[^"]+\.js' index.html | sort -u | head -1)
          echo "bundle: $asset"
          curl -sS "$V$asset" -o bundle.js
          echo "=== api-base context ==="
          grep -oE '.{40}replace\(/\\?/\+\$/.{50}' bundle.js | head -3 || true
          echo
          if grep -q "workspaceapi-server-production" bundle.js; then
            echo "::error::bundle still bakes the production Railway host — fix not deployed yet"
            exit 1
          fi
          echo "OK: no cross-origin API host baked into the bundle; /api stays same-origin."
          echo
          echo "=== belt-and-braces: a full-body POST to staging still returns 201 ==="
          body='{"name":"staging test","birthDate":"1995-08-23","birthTime":"23:45","birthPlace":"Košice, Košický kraj, Slovensko","latitude":48.72,"longitude":21.25,"timezoneOffset":2,"isForSelf":true}'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H "Origin: $V" --data "$body" "$V/api/reports")
          echo "POST $V/api/reports -> $code"
          [ "$code" = "201" ] || { echo "::error::expected 201, got $code"; exit 1; }
