name: Promote

# The fallback door to production while GITHUB_RELEASE_TOKEN is not on
# Railway staging (MB-75, MB-79). The release itself, the lab, the gate and
# the QA agent, runs from the admin Release view on staging (ADR-86); this
# workflow only reads its public verdict, refuses unless that verdict says
# `passed` for the tip of main, smokes staging, fast-forwards the production
# branch with the built-in token, and smokes production. Fast-forward only,
# so production never carries anything main did not, and never past a red
# verdict. No secret is read here.
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: The id of a release the admin Release view ran to `passed` on staging
        required: true
        type: string
      dry_run:
        description: Check the verdict and smoke staging, and skip the push
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verdict:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.read.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: read
        env:
          WEB_URL: https://starsdecoded-staging.vercel.app
        run: |
          body=$(curl -sSf --max-time 20 "$WEB_URL/api/release/${{ inputs.release_id }}/verdict")
          echo "$body"
          sha=$(printf '%s' "$body" | jq -r '.sha')
          status=$(printf '%s' "$body" | jq -r '.status')
          head=$(git rev-parse origin/main)
          if [ "$status" != "passed" ]; then
            echo "::error::release ${{ inputs.release_id }} is '$status', not 'passed'; run the Release view on staging first"
            exit 1
          fi
          if [ "$sha" != "$head" ]; then
            echo "::error::release ${{ inputs.release_id }} passed $sha, but main's head is $head; run the Release view on the current staging"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf -- '- release %s passed for %s\n' "${{ inputs.release_id }}" "$sha" >> "$GITHUB_STEP_SUMMARY"

  staging-smoke:
    needs: verdict
    uses: ./.github/workflows/smoke-run.yml
    with:
      web_url: https://starsdecoded-staging.vercel.app/
      expect_env: staging
      expect_commit: ${{ needs.verdict.outputs.sha }}

  fast-forward:
    needs: [verdict, staging-smoke]
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sha="${{ needs.verdict.outputs.sha }}"
          if git rev-parse --verify -q origin/production >/dev/null; then
            if ! git merge-base --is-ancestor origin/production "$sha"; then
              echo "::error::production has commits that are not on main; merge them back into main first"
              exit 1
            fi
          fi
          git push origin "$sha:refs/heads/production"

  # A push made with the workflow token does not trigger smoke.yml, so the
  # production check runs here.
  production-smoke:
    needs: [verdict, fast-forward]
    uses: ./.github/workflows/smoke-run.yml
    with:
      web_url: https://mystarsdecoded.com/
      expect_env: production
      expect_commit: ${{ needs.verdict.outputs.sha }}
