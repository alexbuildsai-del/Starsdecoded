name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The workspace uses pnpm's `catalog:` protocol, so npm cannot install
      # it. Always pnpm, everywhere.
      - run: pnpm install --frozen-lockfile

      # `build` deliberately does not typecheck (Vercel runs it), so this is
      # the gate that keeps types honest across all projects.
      - run: pnpm run typecheck

      - run: pnpm run build:web
      - run: pnpm run build:api

      # e2e is excluded: Playwright boots the real API and needs a database,
      # which CI has no credentials for. Run it against a deployed preview.
      - run: pnpm -r --filter '!@workspace/e2e' --if-present run test
