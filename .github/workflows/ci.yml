name: CI

on:
  push:
    branches: [main, production]
  pull_request:

# CI only reads: it builds, tests and scans, and holds no secret (ADR-200).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the secret scan can walk any PR or pushed range;
      # no token is left in .git/config for the install's scripts to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # The workspace uses pnpm's `catalog:` protocol, so npm cannot install
      # it. Always pnpm, everywhere.
      - run: pnpm install --frozen-lockfile

      # `build` deliberately does not typecheck (Vercel runs it), so this is
      # the gate that keeps types honest across all projects.
      - run: pnpm run typecheck

      - run: pnpm run build:web
      - run: pnpm run build:api

      # e2e is excluded: Playwright needs a running site and a browser, so it
      # runs against a deployed preview instead.
      - run: pnpm -r --filter '!@workspace/e2e' --if-present run test

      - run: pnpm check:shipped

      - run: pnpm audit --prod --audit-level high

      # Keyless (ADR-200): a release binary pinned by version and checksum, so
      # no Action, licence or token is involved. It runs even when a step above
      # failed, since a pushed key is public at once and must be rotated.
      # --redact keeps the key out of this public log; commit, file and line
      # are enough to find it.
      - name: Scan the new commits for secrets
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 --max-time 120 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          zero=0000000000000000000000000000000000000000
          present() {
            [ "$1" != "$zero" ] &&
              { git cat-file -e "$1^{commit}" 2>/dev/null || git fetch -q --no-tags origin "$1" 2>/dev/null; }
          }
          if [ "$EVENT" = pull_request ]; then base=$PR_BASE head=$PR_HEAD; else base=$BEFORE head=$AFTER; fi
          if present "$base"; then
            range="$base..$head"
          else
            # Only a branch's first push has no base, and production only ever
            # fast-forwards to commits main already scanned.
            [ "$base" = "$zero" ] || echo "::warning::$base is gone from the history; scanning only what main lacks"
            range="origin/main..$head"
          fi
          # gitleaks reports a range git cannot resolve as clean, so git
          # resolves it first and fails the step instead.
          count=$(git rev-list --count "$range")
          echo "scanning $count commits in $range"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$range" .
