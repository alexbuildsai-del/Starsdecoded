name: CI

on:
  push:
    branches: [main, production]
  pull_request:

# CI only reads: it builds, tests and scans, and holds no secret (ADR-200).
permissions:
  contents: read

# A newer push to a pull request or a feature branch makes the older run pointless. main and production runs are
# never cancelled, and each gets a group of its own, since a queued run is replaced by a newer queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the buyer walk (ADR-273). Its password opens
    # nothing outside this job, so it lives here rather than in a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: walk
          POSTGRES_PASSWORD: walk
          POSTGRES_DB: walk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U walk -d walk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # The whole history, so the secret scan can walk any PR or pushed range;
      # no token is left in .git/config for the install's scripts to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A change that touches only docs/, .claude/ or *.md builds and tests the same code as its parent, so the heavy
      # steps are skipped and this job still reports success under the same name. The secret scan below still runs:
      # a key pasted into a doc is as public as one pasted into code. If the changes cannot be read, everything runs.
      - name: Read what changed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            code=$(.github/scripts/changed-code.sh compare "$PR_BASE" "$PR_HEAD")
          elif [ "$REF" = refs/heads/main ]; then
            code=$(.github/scripts/changed-code.sh compare "$BEFORE" "$AFTER")
          else
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "Only docs/, .claude/ or *.md changed, so the build, tests and walk are skipped; the secret scan still runs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.changes.outputs.code != 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.changes.outputs.code != 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # The workspace uses pnpm's `catalog:` protocol, so npm cannot install
      # it. Always pnpm, everywhere.
      - if: steps.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile

      # One copy of React and react-query, or the app's hooks lose their provider (Review 02/10).
      - if: steps.changes.outputs.code != 'false'
        run: pnpm check:copies

      # `build` deliberately does not typecheck (Vercel runs it), so this is
      # the gate that keeps types honest across all projects.
      - if: steps.changes.outputs.code != 'false'
        run: pnpm run typecheck

      - if: steps.changes.outputs.code != 'false'
        run: pnpm run build:web
      - if: steps.changes.outputs.code != 'false'
        run: pnpm run build:api

      # The walk runs on the schema every deploy starts on, made the same way.
      # The bootstrap's prompt step loads the model client, which will not
      # start without a key; this one is sent nowhere.
      - name: Bootstrap the walk's database
        if: steps.changes.outputs.code != 'false'
        timeout-minutes: 5
        env:
          DATABASE_URL: postgres://walk:walk@127.0.0.1:5432/walk
          OPENAI_API_KEY: sk-dummy-walk-never-sent
        run: pnpm run db:bootstrap

      # The critical tier's database parts skip without a database, so it gets the walk's, bootstrapped
      # above: the tests read WALK_DATABASE_URL, the app code under them DATABASE_URL.
      # e2e is excluded: Playwright needs a running site and a browser, so it
      # runs against a deployed preview instead.
      - name: Test the critical tier
        if: steps.changes.outputs.code != 'false'
        env:
          DATABASE_URL: postgres://walk:walk@127.0.0.1:5432/walk
          WALK_DATABASE_URL: postgres://walk:walk@127.0.0.1:5432/walk
        run: pnpm -r --filter '!@workspace/e2e' --if-present run test

      # The Owner's critical flow with the site's sample people, end to end on that
      # database, with no Clerk, no network and no OpenAI (ADR-273).
      - name: Walk the buyer's flow
        if: steps.changes.outputs.code != 'false'
        timeout-minutes: 5
        env:
          WALK_DATABASE_URL: postgres://walk:walk@127.0.0.1:5432/walk
        run: pnpm --filter @workspace/api-server exec tsx src/walk/buyer.walk.ts

      - if: steps.changes.outputs.code != 'false'
        run: pnpm check:shipped

      - if: steps.changes.outputs.code != 'false'
        run: pnpm check:ds

      - if: steps.changes.outputs.code != 'false'
        run: pnpm audit --prod --audit-level high

      # Keyless (ADR-200): a release binary pinned by version and checksum, so
      # no Action, licence or token is involved. It runs even when a step above
      # failed, since a pushed key is public at once and must be rotated.
      # --redact keeps the key out of this public log; commit, file and line
      # are enough to find it.
      - name: Scan the new commits for secrets
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 --max-time 120 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          zero=0000000000000000000000000000000000000000
          present() {
            [ "$1" != "$zero" ] &&
              { git cat-file -e "$1^{commit}" 2>/dev/null || git fetch -q --no-tags origin "$1" 2>/dev/null; }
          }
          if [ "$EVENT" = pull_request ]; then base=$PR_BASE head=$PR_HEAD; else base=$BEFORE head=$AFTER; fi
          if present "$base"; then
            range="$base..$head"
          else
            # Only a branch's first push has no base, and production only ever
            # fast-forwards to commits main already scanned.
            [ "$base" = "$zero" ] || echo "::warning::$base is gone from the history; scanning only what main lacks"
            range="origin/main..$head"
          fi
          # gitleaks reports a range git cannot resolve as clean, so git
          # resolves it first and fails the step instead.
          count=$(git rev-list --count "$range")
          echo "scanning $count commits in $range"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$range" .
