name: Report lab

# R-4.4: no prompt or engine change ships without the report lab run against
# the committed fixtures. This sandbox cannot reach staging, so the run happens
# here: each fixture becomes a real report on staging through its public API,
# and the measurement lands in the run summary and an artifact. Staging only;
# production is read-only for prompts and its reports belong to customers.
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: natal (the chart fixtures), pass (blind, then the horizon pass) or pair (the three lenses, then one parent-and-child run per band)
        required: true
        type: choice
        options: [natal, pass, pair]
        default: natal
      chart:
        description: natal only. Fixture name under fixtures/charts, or "all"
        required: true
        type: string
        default: all
      pair:
        description: pair only. "all" runs the campaign; a fixture name under fixtures/pairs runs that one
        required: false
        type: string
        default: all
      lens:
        description: pair only, with one fixture. "all" takes the fixture's own lens
        required: false
        type: choice
        options: [all, partners, parent_child, people]
        default: all
      label:
        description: Label for the written run files
        required: true
        type: string
        default: staging

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WEB_URL: https://starsdecoded-staging.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Confirm staging answers as staging
        run: |
          body=$(curl -sSf --max-time 20 "$WEB_URL/api/healthz")
          echo "$body"
          [ "$(printf '%s' "$body" | jq -r '.env')" = "staging" ] || { echo "::error::$WEB_URL is not staging"; exit 1; }
          printf -- '- commit under test: %s\n' "$(printf '%s' "$body" | jq -r '.commit')" >> "$GITHUB_STEP_SUMMARY"

      # The pipe into tee must not hide the lab's exit code: a failed fixture
      # is a failed run, with its table and error still in the summary.
      - name: Generate and measure
        run: |
          set -o pipefail
          case "${{ inputs.campaign }}" in
            pass) sel="--pass" ;;
            pair) if [ "${{ inputs.pair }}" = "all" ]; then sel="--pair"; else sel="--pair ${{ inputs.pair }} --lens ${{ inputs.lens }}"; fi ;;
            *) if [ "${{ inputs.chart }}" = "all" ]; then sel="--all"; else sel="--chart ${{ inputs.chart }}"; fi ;;
          esac
          status=0
          pnpm report:lab --remote "$WEB_URL" $sel --label "${{ inputs.label }}" --html 2>&1 | tee lab.log || status=$?
          { echo '## Report lab'; echo '```'; grep -vE '^(wrote |$)' lab.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-lab-${{ inputs.label }}
          path: fixtures/reports/
          if-no-files-found: ignore

      # The reports are the product, so they must be readable without
      # downloading a zip: every run replaces the report-lab/<label> branch,
      # where GitHub renders the .md files. Partial runs publish too. One
      # label per campaign, or the next run's force-push drops the last one.
      - name: Publish the run on the report-lab branch
        if: always()
        run: |
          ls fixtures/reports/*.${{ inputs.label }}.md >/dev/null 2>&1 || { echo "nothing to publish"; exit 0; }
          branch="report-lab/${{ inputs.label }}"
          git config user.name "report-lab"
          git config user.email "report-lab@users.noreply.github.com"
          git checkout -B "$branch"
          git add -f fixtures/reports
          git diff --cached --quiet && { echo "nothing new to publish"; exit 0; }
          git commit -q -m "Report lab: ${{ inputs.campaign }} ${{ inputs.campaign == 'pair' && inputs.pair || inputs.chart }} against staging, run ${{ github.run_id }}"
          git push -f origin "$branch"
          printf -- '- reports: https://github.com/%s/tree/%s/fixtures/reports\n' "$GITHUB_REPOSITORY" "$branch" >> "$GITHUB_STEP_SUMMARY"
