name: Site checks

# Every Vercel preview is measured the way a visitor meets it (ADR-192, 193): Lighthouse for speed and accessibility,
# axe over every public page, and the web half of the security probe. Keyless: it reads only the public preview, holds
# no secret, and keeps every report as a workflow artifact, never on a public link. A preview's /api is staging's API
# (vercel.json), so the probe's API half runs in smoke after the merge instead.
#
# A deployment_status run cannot be filtered by path, so the first job reads what the deployed commit changed and the
# heavy jobs wait for its answer: a commit that touches only docs/, .claude/ or *.md deploys the same site and is not
# measured again. If the changes cannot be read, the checks run. The web probe rides in the axe job and the address
# check in the first job, since each takes seconds and a job bills a whole minute.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  preview:
    name: Preview address
    # Vercel posts a pending status before the final one, and Railway posts its own deploys; only a finished Vercel
    # preview has pages to read.
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      url: ${{ steps.url.outputs.url }}
      code: ${{ steps.scope.outputs.code }}
      group: ${{ steps.scope.outputs.group }}
    steps:
      - id: url
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          url="${DEPLOYMENT_URL%/}"
          if ! printf '%s' "$url" | grep -qE '^https://starsdecoded-[a-z0-9-]+\.vercel\.app$'; then
            echo "::error::The deployment's address '$url' is not a Vercel preview of this project, so there is nothing to check."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      # The deployment is named by its sha, so its branch is whichever one has that commit at its tip. A feature
      # branch is read against main, so a docs-only push after a code push still measures the code. main (and a
      # commit no branch points at any more) is read against its own parent and never shares a group, so no run of
      # a main commit is cancelled by a later one.
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          echo "code=true" >> "$GITHUB_OUTPUT"
          echo "group=sha-$SHA" >> "$GITHUB_OUTPUT"
          heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/branches-where-head" --jq '.[].name' 2>/dev/null || true)
          if printf '%s\n' "$heads" | grep -qxE 'main|production' || [ -z "$heads" ]; then
            code=$(.github/scripts/changed-code.sh commit "$SHA")
          else
            echo "group=branch-$(printf '%s\n' "$heads" | head -n 1)" >> "$GITHUB_OUTPUT"
            code=$(.github/scripts/changed-code.sh compare main "$SHA")
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "Only docs/, .claude/ or *.md changed, so Lighthouse, axe and the web probe are skipped for this commit." >> "$GITHUB_STEP_SUMMARY"
          fi

  lighthouse:
    name: Lighthouse
    needs: preview
    if: needs.preview.outputs.code != 'false'
    # A newer push to the same branch makes this run's page obsolete.
    concurrency:
      group: site-checks-lighthouse-${{ needs.preview.outputs.group }}
      cancel-in-progress: ${{ startsWith(needs.preview.outputs.group, 'branch-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
          sparse-checkout: e2e
          persist-credentials: false
      # The Action brings Lighthouse with it, so none enters the lockfile or the Vercel and Railway installs. The budgets,
      # the phone preset and the median of three runs live in the config.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            ${{ needs.preview.outputs.url }}/
            ${{ needs.preview.outputs.url }}/sample
            ${{ needs.preview.outputs.url }}/faq
            ${{ needs.preview.outputs.url }}/timeline
          configPath: e2e/lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse
          temporaryPublicStorage: false

  axe:
    name: axe
    needs: preview
    if: needs.preview.outputs.code != 'false'
    concurrency:
      group: site-checks-axe-${{ needs.preview.outputs.group }}
      cancel-in-progress: ${{ startsWith(needs.preview.outputs.group, 'branch-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      # The web half of the security probe. It was a job of its own that billed a minute for seconds of work; it runs
      # first and the steps below still run after a miss, so one red check never hides the other.
      - name: Security probe (web)
        run: .github/scripts/security-probe.sh "$WEB_URL" web
        env:
          WEB_URL: ${{ needs.preview.outputs.url }}
          DEADLINE_SECONDS: 60
      - if: ${{ !cancelled() }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The checks' own packages, plus the web's for the charts harness below; the pages come built from the preview.
      - if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile --filter @workspace/e2e --filter @workspace/web...
      - if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/e2e exec playwright install --with-deps --only-shell chromium
      - if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/e2e test
        env:
          BASE_URL: ${{ needs.preview.outputs.url }}
      # The Chart part's examples on a dev harness built from the checked-out source, never from the preview: the page is
      # not part of the build, so it is not deployed. Keyless like the rest of this file (ADR-441).
      - name: Charts shot (390 and 880 px)
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/web exec node scripts/charts-harness.mjs ../e2e/test-results/charts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axe
          path: e2e/test-results/
