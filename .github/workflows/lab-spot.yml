name: Lab spot

# Level 1 of the lab (ADR-76): after a green staging Smoke on main, when the
# merge touched the brain, replay only what changed on two charts with the
# foundation held from the stored run, on Flex, and compare in Runs. A
# section file maps to its section; anything else in the brain is a
# pipeline change, which replays one whole report on one chart. Pair prompts
# stay on 5.2 until their own matrix, so they do not spot here.
on:
  workflow_run:
    workflows: [Smoke]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  diff:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.map.outputs.changed }}
      sections: ${{ steps.map.outputs.sections }}
      charts: ${{ steps.map.outputs.charts }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: map
        run: |
          files=$(git diff --name-only HEAD^ HEAD -- api/src/prompts api/src/lib/models.ts api/src/lib/aiInterpretation.ts api/src/lib/traditional.ts api/src/lib/chartCalculation.ts)
          echo "$files"
          if [ -z "$files" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no brain change; no spot"; exit 0; fi
          natal=$(echo "$files" | grep -v '^api/src/prompts/pair/' || true)
          if [ -z "$natal" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "only pair prompts changed; the pair matrix is not built"; exit 0; fi
          sections=$(echo "$natal" | sed -n 's|^api/src/prompts/sections/\([a-z]*\)\.ts$|\1|p' | sort -u | tr '\n' ',' | sed 's/,$//')
          other=$(echo "$natal" | grep -v '^api/src/prompts/sections/' || true)
          if [ -n "$other" ]; then
            echo "sections=pipeline" >> "$GITHUB_OUTPUT"
            echo "charts=marie-curie" >> "$GITHUB_OUTPUT"
          else
            echo "sections=$sections" >> "$GITHUB_OUTPUT"
            echo "charts=marie-curie,day-angular" >> "$GITHUB_OUTPUT"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

  spot:
    needs: diff
    if: needs.diff.outputs.changed == 'true'
    uses: ./.github/workflows/report-lab.yml
    with:
      campaign: spot
      label: spot-${{ github.event.workflow_run.head_sha }}
      sections: ${{ needs.diff.outputs.sections }}
      charts: ${{ needs.diff.outputs.charts }}
      base: r06
    secrets: inherit
